      options: (v) => optionRecords(Store.all('roles'), v, r => r.title, '— none —') },
    { name: 'changeType', label: 'Direction', type: 'select',
      options: (v) => optionList(CHANGE_TYPES, v || 'Increase') },
    { name: 'fte', label: 'FTE', type: 'number', min: 0, step: 0.5, hint: 'always positive' },
    { name: 'sourcing', label: 'Sourcing', type: 'select', options: (v) => optionList(SOURCINGS, v || 'Internal') },
    { name: 'startQuarter', label: 'Effective from', type: 'select', options: (v) => optionList(QUARTERS, v || 'Q1') },
    { name: 'commitment', label: 'Commitment', type: 'select',
      options: (v) => optionList(COMMITMENTS, v || 'Contingent'),
      hint: 'Committed ignores triggers' },
    { name: 'status', label: 'Status', type: 'select', options: (v) => optionList(REQ_STATUSES, v || 'Submitted') },
    { name: 'requestedBy', label: 'Requested by', placeholder: 'Head of Retail' },
    { name: 'justification', label: 'Justification', type: 'textarea', rows: 3, full: true,
      placeholder: 'Why this capacity is needed, and what happens without it.' },
  ],

  /* ── Trigger linking ── */
  extraInit: (item) => ({
    links: JSON.parse(JSON.stringify(item.links || [])),
    changeType: item.changeType || 'Increase',
    commitment: item.commitment || 'Contingent',
    fte: Math.abs(Number(item.fte) || 0),
  }),

  extraForm: (item, st) => '<div class="section" style="margin:20px 0 0">'
    + '<div class="section-header"><span class="section-title">Strategy triggers</span>'
    + '<span class="section-note">what has to land for this to happen</span></div>'
    + '<div class="card">'
    +   '<div id="link-chips">' + renderLinkChips(st) + '</div>'
    +   '<div class="flex gap-2 flex-wrap items-center" style="margin-top:12px">'
    +     '<select id="link-pick" style="flex:1;min-width:220px">'
    +       '<option value="">Attach a strategy delivery…</option>'
    +       optionRecords(Store.all('deliverables'), null,
            d => d.name + '  (' + d.targetQuarter + ', ' + Math.round(Planning.effectiveProbability(d) * 100) + '%)')
    +     '</select>'
    +     '<input id="link-note" type="text" placeholder="Condition, e.g. AUM reaches 250M" style="flex:1;min-width:200px">'
    +     '<button type="button" class="btn btn-ghost btn-sm" id="link-add">Attach</button>'
    +   '</div>'
    + '</div></div>'
    + '<div style="margin-top:16px" id="req-preview">' + renderRequestPreview(st) + '</div>',

  extraBind: (st) => {
    const chips = () => {
      document.getElementById('link-chips').innerHTML = renderLinkChips(st);
      document.getElementById('req-preview').innerHTML = renderRequestPreview(st);
      bindRemove();
    };
    const bindRemove = () => {
      document.querySelectorAll('#link-chips button[data-rm]').forEach(b => {
        b.addEventListener('click', () => { st.links.splice(Number(b.dataset.rm), 1); chips(); });
      });
    };
    bindRemove();

    document.getElementById('link-add').addEventListener('click', () => {
      const sel = document.getElementById('link-pick');
      const id = sel.value;
      if (!id) return;
      if (st.links.some(l => l.deliverableId === id)) { sel.value = ''; return; }
      st.links.push({ deliverableId: id, conditionNote: document.getElementById('link-note').value.trim() });
      sel.value = '';
      document.getElementById('link-note').value = '';
      chips();
    });

    /* The preview has to track the fields it depends on, or it would show the
       behaviour of the ask as it was loaded rather than as it is being typed. */
    ['changeType', 'commitment', 'fte'].forEach(name => {
      const el = document.getElementById('f_' + name);
      if (!el) return;
      el.addEventListener('input', () => {
        st.changeType = document.getElementById('f_changeType').value;
        st.commitment = document.getElementById('f_commitment').value;
        st.fte = Math.abs(Number(document.getElementById('f_fte').value) || 0);
        document.getElementById('link-chips').innerHTML = renderLinkChips(st);
        document.getElementById('req-preview').innerHTML = renderRequestPreview(st);
        bindRemove();
      });
    });
  },

  extraCollect: (values, st) => { values.links = st.links; },

  transform: (v) => {
    v.fte = Math.abs(Number(v.fte) || 0);       // direction lives in changeType, never in the sign
    v.title = (v.title || '').trim();
  },

  validate: (v) => {
    const e = [];
    if (!v.title) e.push('Give the request a short title.');
    if (!v.lineId) e.push('Pick a business line.');
    if (!(v.fte > 0)) e.push('FTE must be greater than zero.');
    if (v.commitment === 'Contingent' && (!v.links || !v.links.length)) {
      e.push('A contingent request needs at least one strategy trigger — otherwise mark it Committed.');
    }
    return e;
  },

  columns: [
    { head: 'Request', cell: i => '<span class="fw-600">' + esc(i.title) + '</span>'
        + '<div class="small text-muted">' + esc(Fmt.lineCode(i.lineId)) + ' · ' + esc(Fmt.roleName(i.roleId))
        + (i.requestedBy ? ' · ' + esc(i.requestedBy) : '') + '</div>' },
    { head: 'Dir', cell: i => Fmt.badge(i.changeType === 'Decrease' ? 'Release' : 'Add',
        i.changeType === 'Decrease' ? 'decrease' : 'increase') },
    { head: 'FTE', right: true, cell: i => '<span class="nums fw-700 ' + (i.changeType === 'Decrease' ? 'text-warn' : 'text-green') + '">'
        + (i.changeType === 'Decrease' ? '−' : '+') + Fmt.fte(i.fte) + '</span>' },
    { head: 'From', cell: i => '<span class="nums text-dim">' + esc(i.startQuarter) + '</span>' },
    { head: 'Src', cell: i => Fmt.badge(i.sourcing || 'Internal', i.sourcing === 'Vendor' ? 'vendor' : 'internal') },
    { head: 'Commitment', cell: i => Fmt.badge(i.commitment, i.commitment === 'Committed' ? 'committed' : 'contingent') },
    { head: 'Triggers', cell: i => {
        if (i.commitment === 'Committed') return '<span class="small text-muted">unconditional</span>';
        if (!i.links || !i.links.length) return '<span class="small text-warn">none attached</span>';
        return i.links.map(l => '<div class="small text-dim">' + esc(Fmt.dlvName(l.deliverableId)) + '</div>').join(''); } },
    { head: 'Likelihood', right: true, cell: i => {
        const p = Planning.combinedProbability(i) * 100;
        return '<span class="nums">' + Fmt.pct(p) + '</span>'; } },
    { head: 'Base', right: true, cell: i => {
        const r = Planning.resolveRequest(i, 'Base');
        return r.factor === 0 ? '<span class="text-muted">out</span>'
          : '<span class="nums fw-600">' + Fmt.fte(r.signedFte, true) + '</span>'; } },
    { head: 'Status', cell: i => Fmt.statusBadge(i.status) },
  ],

  footRow: (list) => {
    const inc = list.filter(i => i.changeType !== 'Decrease').reduce((n, i) => n + Math.abs(i.fte), 0);
    const dec = list.filter(i => i.changeType === 'Decrease').reduce((n, i) => n + Math.abs(i.fte), 0);
    const base = list.reduce((n, i) => n + Planning.resolveRequest(i, 'Base').signedFte, 0);
    return '<tr><td>Total of the ' + list.length + ' shown</td><td></td>'
      + '<td class="right nums"><span class="text-green">+' + Fmt.fte(inc) + '</span> / <span class="text-warn">−' + Fmt.fte(dec) + '</span></td>'
      + '<td colspan="5"></td>'
      + '<td class="right nums">' + Fmt.fte(base, true) + '</td><td></td></tr>';
  },

  deletePrompt: (i) => 'Delete <strong>' + esc(i.title) + '</strong>?',

  csv: (list) => [['Request', 'Line', 'Role', 'Direction', 'FTE', 'From', 'Sourcing', 'Commitment',
                   'Triggers', 'Likelihood %', 'Base FTE', 'Status', 'Requested by', 'Justification']].concat(
    list.map(i => [i.title, Fmt.lineName(i.lineId), Fmt.roleName(i.roleId), i.changeType, i.fte,
      i.startQuarter, i.sourcing, i.commitment,
      (i.links || []).map(l => Fmt.dlvName(l.deliverableId)).join(' + '),
      Math.round(Planning.combinedProbability(i) * 100),
      Planning.resolveRequest(i, 'Base').signedFte, i.status, i.requestedBy, i.justification])),

  footnote: () => 'The <strong>Base</strong> column shows what this request contributes at the current likelihood '
    + 'threshold of <strong>' + Store.state.meta.baseThresholdPct + '%</strong>. Change it in Data &amp; Settings, '
    + 'or drag the slider on Scenarios to see where the number tips.',
}));

/* ═══════════════════════════════════════════════════════════════════════════
   DASHBOARD
   ═══════════════════════════════════════════════════════════════════════════ */
registerPage('dashboard', {
  render() {
    const yr = Store.state.meta.planningYear;
    return '<div class="page-header">' + yr + ' Capacity Position</div>'
      + '<div class="page-sub">Where the plan stands today, at the <strong>Base</strong> scenario — committed asks plus '
      + 'every conditional one whose triggers clear ' + Store.state.meta.baseThresholdPct + '% likelihood. '
      + 'Headline FTE is the Q4 exit run-rate.</div>'
      + '<div id="dash-warnings"></div>'
      + '<div id="dash-kpis" class="kpi-grid mb-6"></div>'
      + '<div class="section"><div class="section-header">'
      +   '<span class="section-title">Scenario comparison</span>'
      +   '<span class="section-note">required FTE at year end</span></div>'
      +   '<div class="card"><div class="chart-wrap" id="chart-scenarios"></div>'
      +   '<div id="legend-scenarios"></div></div></div>'
      + '<div class="section"><div class="section-header"><span class="section-title">Quarterly build-up</span>'
      +   '<span class="section-note">Base · headcount present in each quarter</span></div>'
      +   '<div class="card"><div class="chart-wrap" id="chart-quarterly"></div></div></div>'
      + '<div class="section"><div class="section-header"><span class="section-title">From today to ' + yr + '</span>'
      +   '<span class="section-note">Base</span></div>'
      +   '<div class="card"><div class="chart-wrap" id="chart-waterfall"></div>'
      +   '<div class="footnote">The axis starts at zero, so the adjustments read small against the size of the '
      +   'existing organisation — which is the point: a year of strategy moves this base by single-digit percent.</div>'
      +   '</div></div>'
      + '<div class="section"><div class="section-header">'
      +   '<span class="section-title">By business line</span>'
      +   '<span class="section-note">Base scenario</span>'
      +   '<div class="spacer"></div>'
      +   '<button class="btn btn-ghost btn-sm no-print" id="dash-export">Export CSV</button></div>'
      +   '<div class="table-wrap" id="dash-lines"></div></div>'
      + '<div class="section"><div class="section-header">'
      +   '<span class="section-title">Where the strategy bites hardest</span>'
      +   '<span class="section-note">headcount whose fate each delivery decides</span></div>'
      +   '<div class="card"><div class="chart-wrap" id="chart-impact"></div>'
      +   '<div class="footnote">A request with more than one trigger appears under each of them, so these bars '
      +   'describe exposure rather than adding up to a total. Full detail on '
      +   '<a href="#impact" style="color:var(--primary)">Deliverable Impact</a>.</div></div></div>';
  },

  init() {
    const base = Planning.scenarioRollup('Base');
    const all = Planning.allScenarios();

    /* ── Data-quality banner ── */
    const warns = Planning.coverageWarnings();
    document.getElementById('dash-warnings').innerHTML = warns.length
      ? '<div class="alert alert-' + (warns.some(w => w.level === 'warn') ? 'warn' : 'info') + '">'
        + '<strong>Worth a look before you circulate this:</strong><ul>'
        + warns.map(w => '<li>' + w.text + '</li>').join('') + '</ul></div>'
      : '';

    /* ── KPIs ── */
    const opt = Planning.optimizationSummary().reduce((n, o) => n + o.optimizable, 0);
    const grossAsk = Store.all('requests').filter(r => r.changeType !== 'Decrease')
      .reduce((n, r) => n + Math.abs(Number(r.fte) || 0), 0);
    const grossRelease = Store.all('requests').filter(r => r.changeType === 'Decrease')
      .reduce((n, r) => n + Math.abs(Number(r.fte) || 0), 0);

    const cards = [
      { label: 'Capacity today', value: Fmt.fte(base.baselineFte),
        sub: Fmt.money(base.baselineCost) + ' a year' },
      { label: 'Optimisable now', value: '−' + Fmt.fte(opt), cls: 'text-warn',
        sub: Fmt.pct(base.baselineFte ? opt / base.baselineFte * 100 : 0, 1) + ' of current capacity' },
      { label: 'Total asks on the table', value: '+' + Fmt.fte(grossAsk), cls: 'text-green',
        sub: 'across ' + Store.all('requests').filter(r => r.changeType !== 'Decrease').length + ' requests' },
      { label: 'Strategy-driven release', value: '−' + Fmt.fte(grossRelease), cls: 'text-warn',
        sub: 'across ' + Store.all('requests').filter(r => r.changeType === 'Decrease').length + ' requests' },
      { label: 'Required at Q4 · Base', value: Fmt.fte(base.requirementFte), cls: 'fw-700',
        sub: Fmt.fte(base.gapFte, true) + ' against today' },
      { label: 'Annual cost · Base', value: Fmt.money(base.requirementCost),
        sub: Fmt.money(base.requirementCost - base.baselineCost, true) + ' vs today' },
    ];
    document.getElementById('dash-kpis').innerHTML = cards.map(c =>
      '<div class="kpi-card"><div class="kpi-label">' + esc(c.label) + '</div>'
      + '<div class="kpi-value ' + (c.cls || '') + '">' + c.value + '</div>'
      + '<div class="kpi-sub">' + c.sub + '</div></div>').join('');

    /* ── Scenario comparison ── */
    document.getElementById('chart-scenarios').innerHTML = Svg.bars(
      all.map(r => ({
        name: r.scenario, value: r.requirementFte, color: SCENARIO_COLOR[r.scenario],
        label: Fmt.fte(r.requirementFte),
        sub: Fmt.fte(r.gapFte, true) + ' vs today',
      })),
      { reference: base.baselineFte, referenceLabel: 'capacity today', height: 270 }
    );
    document.getElementById('legend-scenarios').innerHTML =
      '<div class="footnote">' + SCENARIOS.map(s =>
        '<div style="margin-top:4px"><strong style="color:' + SCENARIO_COLOR[s] + '">' + s + '</strong> — '
        + SCENARIO_BLURB[s] + '</div>').join('') + '</div>';

    /* ── Quarterly ── */
    document.getElementById('chart-quarterly').innerHTML = Svg.line(
      base.byQuarter.map(q => ({ name: Store.state.meta.planningYear + ' ' + q.quarter, value: q.fte, label: Fmt.fte(q.fte) })),
      { reference: base.baselineFte, referenceLabel: 'today', height: 230 }
    );

    /* ── Waterfall ── */
    document.getElementById('chart-waterfall').innerHTML = Svg.waterfall([
      { name: 'Capacity today', value: base.baselineFte, total: true },
      { name: 'Optimisation', value: -base.optimizableFte, color: '#f59e0b' },
      { name: 'Asks', value: base.increaseFte, color: '#22c55e' },
      { name: 'Strategy release', value: base.decreaseFte, color: '#f59e0b' },
      { name: 'Required ' + Store.state.meta.planningYear, value: base.requirementFte, total: true, color: '#6366f1' },
    ], { height: 270 });

    /* ── By line ── */
    const rowsFor = (r) => {
      const line = Store.byId('businessLines', r.key);
      return { name: line ? line.name : '(unassigned)', code: line ? line.code : '—', r };
    };
    const lineRows = base.byLine.map(rowsFor);
    document.getElementById('dash-lines').innerHTML =
      '<table><thead><tr><th>Business line</th><th class="right">Today</th>'
      + '<th class="right">Optimise</th><th class="right">Asks</th><th class="right">Release</th>'
      + '<th class="right">Required</th><th class="right">Gap</th><th class="right">Annual cost</th></tr></thead><tbody>'
      + lineRows.map(x =>
        '<tr><td class="fw-600">' + esc(x.name) + '</td>'
        + '<td class="right nums">' + Fmt.fte(x.r.baselineFte) + '</td>'
        + '<td class="right nums ' + (x.r.optimizableFte ? 'text-warn' : 'text-muted') + '">' + (x.r.optimizableFte ? '−' + Fmt.fte(x.r.optimizableFte) : '—') + '</td>'
        + '<td class="right nums ' + (x.r.increaseFte ? 'text-green' : 'text-muted') + '">' + (x.r.increaseFte ? '+' + Fmt.fte(x.r.increaseFte) : '—') + '</td>'
        + '<td class="right nums ' + (x.r.decreaseFte ? 'text-warn' : 'text-muted') + '">' + (x.r.decreaseFte ? Fmt.fte(x.r.decreaseFte, true) : '—') + '</td>'
        + '<td class="right nums fw-700">' + Fmt.fte(x.r.requirementFte) + '</td>'
        + '<td class="right nums ' + Fmt.cls(x.r.gapFte) + '">' + Fmt.fte(x.r.gapFte, true) + '</td>'
        + '<td class="right nums">' + Fmt.money(x.r.requirementCost) + '</td></tr>').join('')
      + '</tbody><tfoot><tr><td>Total</td>'
      + '<td class="right nums">' + Fmt.fte(base.baselineFte) + '</td>'
      + '<td class="right nums text-warn">−' + Fmt.fte(base.optimizableFte) + '</td>'
      + '<td class="right nums text-green">+' + Fmt.fte(base.increaseFte) + '</td>'
      + '<td class="right nums text-warn">' + Fmt.fte(base.decreaseFte, true) + '</td>'
      + '<td class="right nums">' + Fmt.fte(base.requirementFte) + '</td>'
      + '<td class="right nums ' + Fmt.cls(base.gapFte) + '">' + Fmt.fte(base.gapFte, true) + '</td>'
      + '<td class="right nums">' + Fmt.money(base.requirementCost) + '</td></tr></tfoot></table>';

    document.getElementById('dash-export').addEventListener('click', () => {
      exportCSV('capacity-by-line', [['Business line', 'Today FTE', 'Optimisable FTE', 'Asks FTE',
        'Release FTE', 'Required FTE', 'Gap FTE', 'Annual cost ' + Store.state.meta.currency]]
        .concat(lineRows.map(x => [x.name, x.r.baselineFte, x.r.optimizableFte, x.r.increaseFte,
          x.r.decreaseFte, x.r.requirementFte, x.r.gapFte, Math.round(x.r.requirementCost)])));
    });

    /* ── Impact tornado ── */
    const impact = Planning.deliverableImpact().filter(d => d.requestCount > 0).slice(0, 8);
    document.getElementById('chart-impact').innerHTML = impact.length
      ? Svg.tornado(impact.map(d => ({
          name: d.deliverable.name, pos: d.unlockFte, neg: d.releaseFte,
          sub: Fmt.pct(d.probability * 100),
        })), { labelWidth: 240 })
      : '<div class="empty-state">No requests are linked to a strategy delivery yet.</div>';
  },
});

/* ═══════════════════════════════════════════════════════════════════════════
   SCENARIOS
   ═══════════════════════════════════════════════════════════════════════════ */
registerPage('scenarios', {
  render() {
    return '<div class="page-header">Scenario Workbench</div>'
      + '<div class="page-sub">The same plan under five assumptions about what the 2027 roadmap actually delivers. '
      + 'The threshold slider only moves the <strong>Base</strong> case — drag it to find the point where a '
      + 'delivery starts counting.</div>'
      + '<div class="section no-print"><div class="card">'
      +   '<div class="flex gap-3 flex-wrap items-center">'
      +     '<div class="field" style="flex:2;min-width:280px">'
      +       '<label for="thr">Base-case likelihood threshold — <strong id="thr-val"></strong></label>'
      +       '<input type="range" id="thr" min="0" max="100" step="5">'
      +     '</div>'
      +     '<div class="field" style="flex:1;min-width:200px">'
      +       '<label for="scn-line">Business line</label>'
      +       '<select id="scn-line"></select>'
      +     '</div>'
      +     '<div class="field" style="flex:1;min-width:170px">'
      +       '<label for="scn-unit">Measure in</label>'
      +       '<select id="scn-unit"><option value="fte">FTE</option><option value="cost">Cost</option><option value="hours">Hours</option></select>'
      +     '</div>'
      +   '</div>'
      +   '<div class="small text-muted" id="thr-note" style="margin-top:8px"></div>'
      + '</div></div>'
      + '<div id="scn-body"></div>';
  },

  init() {
    const thr = document.getElementById('thr');
    const lineSel = document.getElementById('scn-line');
    const unitSel = document.getElementById('scn-unit');

    thr.value = Store.state.meta.baseThresholdPct;
    lineSel.innerHTML = '<option value="">All business lines</option>'
      + optionRecords(Store.all('businessLines'), null, r => r.name);

    const draw = () => {
      const threshold = Number(thr.value);
      const lineId = lineSel.value || null;
      const unit = unitSel.value;
      document.getElementById('thr-val').textContent = threshold + '%';

      const opts = { thresholdPct: threshold, lineId: lineId };
      const all = SCENARIOS.map(s => Planning.scenarioRollup(s, opts));
      const base = all[1];

      /* How many requests the current threshold actually admits — the slider is
         meaningless without knowing whether it changed anything. */
      const pool = Store.all('requests').filter(r => !lineId || r.lineId === lineId);
      const inBase = pool.filter(r => Planning.inclusionFactor(r, 'Base', threshold) > 0).length;
      document.getElementById('thr-note').innerHTML =
        '<strong>' + inBase + '</strong> of ' + pool.length + ' requests clear ' + threshold + '% and count in Base'
        + (threshold !== Store.state.meta.baseThresholdPct
          ? ' · <span class="text-warn">exploring — the saved threshold is still '
            + Store.state.meta.baseThresholdPct + '%</span>'
          : ' · this is the saved threshold');

      const pick = (r) => unit === 'cost' ? r.requirementCost : unit === 'hours' ? r.requirementHours : r.requirementFte;
      const fmt = (v) => unit === 'cost' ? Fmt.money(v) : unit === 'hours' ? Fmt.hours(v) : Fmt.fte(v);
      const fmtS = (v) => unit === 'cost' ? Fmt.money(v, true) : unit === 'hours' ? Fmt.hours(v) : Fmt.fte(v, true);
      const baseVal = (r) => unit === 'cost' ? r.baselineCost : unit === 'hours' ? r.baselineHours : r.baselineFte;

      let h = '<div class="section"><div class="section-header"><span class="section-title">Five scenarios side by side</span>'
        + '<span class="section-note">' + (lineId ? esc(Fmt.lineName(lineId)) : 'whole organisation') + '</span></div>'
        + '<div class="card"><div class="chart-wrap">'
        + Svg.bars(all.map(r => ({
            name: r.scenario, value: pick(r), color: SCENARIO_COLOR[r.scenario], label: fmt(pick(r)),
            sub: fmtS(pick(r) - baseVal(r)) + ' vs today',
          })), {
            reference: baseVal(all[0]), referenceLabel: 'today', height: 280,
            fmtTick: (v) => unit === 'cost' ? Fmt.money(v) : unit === 'hours' ? Fmt.hours(v) : Math.round(v),
          })
        + '</div></div></div>';

      /* Full numeric table — the chart shows shape, this settles arguments. */
      h += '<div class="section"><div class="section-header"><span class="section-title">The numbers</span>'
        + '<div class="spacer"></div><button class="btn btn-ghost btn-sm no-print" id="scn-export">Export CSV</button></div>'
        + '<div class="table-wrap"><table><thead><tr><th>Scenario</th>'
        + '<th class="right">Asks FTE</th><th class="right">Release FTE</th><th class="right">Net Δ</th>'
        + '<th class="right">Required FTE</th><th class="right">Gap</th>'
        + '<th class="right">Annual cost</th><th class="right">Hours</th>'
        + '<th class="right">Internal</th><th class="right">Vendor</th></tr></thead><tbody>'
        + all.map(r => '<tr><td><span class="fw-700" style="color:' + SCENARIO_COLOR[r.scenario] + '">' + r.scenario + '</span>'
            + '<div class="small text-muted">' + SCENARIO_BLURB[r.scenario] + '</div></td>'
          + '<td class="right nums text-green">' + (r.increaseFte ? '+' + Fmt.fte(r.increaseFte) : '—') + '</td>'
          + '<td class="right nums text-warn">' + (r.decreaseFte ? Fmt.fte(r.decreaseFte, true) : '—') + '</td>'
          + '<td class="right nums ' + Fmt.cls(r.netDeltaFte) + '">' + Fmt.fte(r.netDeltaFte, true) + '</td>'
          + '<td class="right nums fw-700">' + Fmt.fte(r.requirementFte) + '</td>'
          + '<td class="right nums ' + Fmt.cls(r.gapFte) + '">' + Fmt.fte(r.gapFte, true) + '</td>'
          + '<td class="right nums">' + Fmt.money(r.requirementCost) + '</td>'
          + '<td class="right nums text-dim">' + Fmt.hours(r.requirementHours) + '</td>'
          + '<td class="right nums text-dim">' + Fmt.fte(r.bySourcing.Internal.requirementFte) + '</td>'
          + '<td class="right nums text-dim">' + Fmt.fte(r.bySourcing.Vendor.requirementFte) + '</td></tr>').join('')
        + '</tbody></table></div></div>';

      /* Per-line spread between the extremes — where the planning risk sits. */
      if (!lineId) {
        const lines = Store.all('businessLines').map(l => {
          const d = Planning.scenarioRollup('Downside', { thresholdPct: threshold, lineId: l.id });
          const b = Planning.scenarioRollup('Base',     { thresholdPct: threshold, lineId: l.id });
          const u = Planning.scenarioRollup('Upside',   { thresholdPct: threshold, lineId: l.id });
          return { line: l, d, b, u, spread: u.requirementFte - d.requirementFte };
        }).sort((a, b) => b.spread - a.spread);

        h += '<div class="section"><div class="section-header"><span class="section-title">Planning risk by line</span>'
          + '<span class="section-note">how far the answer can move</span></div>'
          + '<div class="table-wrap"><table><thead><tr><th>Business line</th><th class="right">Today</th>'
          + '<th class="right">Downside</th><th class="right">Base</th><th class="right">Upside</th>'
          + '<th class="right">Spread</th><th style="width:180px">Range</th></tr></thead><tbody>'
          + lines.map(x => {
              const maxSpread = Math.max(...lines.map(y => y.spread), 1);
              return '<tr><td class="fw-600">' + esc(x.line.name) + '</td>'
                + '<td class="right nums text-dim">' + Fmt.fte(x.b.baselineFte) + '</td>'
                + '<td class="right nums" style="color:' + SCENARIO_COLOR.Downside + '">' + Fmt.fte(x.d.requirementFte) + '</td>'
                + '<td class="right nums fw-700">' + Fmt.fte(x.b.requirementFte) + '</td>'
                + '<td class="right nums" style="color:' + SCENARIO_COLOR.Upside + '">' + Fmt.fte(x.u.requirementFte) + '</td>'
                + '<td class="right nums fw-600">' + Fmt.fte(x.spread) + '</td>'
                + '<td>' + meter(x.spread / maxSpread * 100, 'var(--primary)') + '</td></tr>';
            }).join('')
          + '</tbody></table></div>'
          + '<div class="footnote">Spread is Upside minus Downside — the width of the range this line could land in. '
          + 'A wide spread means the headcount answer depends heavily on delivery, and is worth a contingency plan '
          + 'rather than a single number.</div></div>';
      }

      /* By role, Base only. */
      h += '<div class="section"><div class="section-header"><span class="section-title">By role</span>'
        + '<span class="section-note">Base at ' + threshold + '%</span></div>'
        + '<div class="card"><div class="chart-wrap">'
        + Svg.hbars(base.byRole.filter(r => r.netDeltaFte !== 0).map(r => ({
            name: Fmt.roleName(r.key), value: r.netDeltaFte,
            color: r.netDeltaFte >= 0 ? '#22c55e' : '#f59e0b',
          })), { labelWidth: 170 })
        + '</div><div class="footnote">Net change by role, after optimisation and strategy-driven release. '
        + 'Roles with no net movement are hidden.</div></div></div>';

      document.getElementById('scn-body').innerHTML = h;

      document.getElementById('scn-export').addEventListener('click', () => {
        exportCSV('scenarios', [['Scenario', 'Asks FTE', 'Release FTE', 'Net FTE', 'Required FTE', 'Gap FTE',
          'Annual cost ' + Store.state.meta.currency, 'Hours', 'Internal FTE', 'Vendor FTE']]
          .concat(all.map(r => [r.scenario, r.increaseFte, r.decreaseFte, r.netDeltaFte, r.requirementFte,
            r.gapFte, Math.round(r.requirementCost), Math.round(r.requirementHours),
            r.bySourcing.Internal.requirementFte, r.bySourcing.Vendor.requirementFte])));
      });
    };

    thr.addEventListener('input', draw);
    lineSel.addEventListener('change', draw);
    unitSel.addEventListener('change', draw);
    draw();
  },
});

/* ═══════════════════════════════════════════════════════════════════════════
   DELIVERABLE IMPACT
   ═══════════════════════════════════════════════════════════════════════════ */
registerPage('impact', {
  render() {
    return '<div class="page-header">Deliverable Impact</div>'
      + '<div class="page-sub">What each 2027 strategy delivery is carrying. Read down the <strong>Exposure</strong> column '
      + 'to find the deliveries that decide the most headcount — those are the ones whose slippage costs you a plan, '
      + 'not just a milestone.</div>'
      + '<div id="impact-body"></div>';
  },

  init() {
    const impact = Planning.deliverableImpact();
    const linked = impact.filter(d => d.requestCount > 0);
    const body = document.getElementById('impact-body');

    if (!linked.length) {
      body.innerHTML = '<div class="empty-state">No requests are linked to a strategy delivery yet. '
        + 'Attach triggers on the <a href="#requests">Demand Requests</a> page and this view fills in.</div>';
      return;
    }

    let h = '<div class="section"><div class="card"><div class="chart-wrap">'
      + Svg.tornado(linked.map(d => ({
          name: d.deliverable.name, pos: d.unlockFte, neg: d.releaseFte,
          sub: Fmt.pct(d.probability * 100) + ' · ' + d.deliverable.targetQuarter,
        })), { labelWidth: 260 })
      + '</div>' + Svg.legend([
          { name: 'Unlocks headcount', color: '#22c55e' },
          { name: 'Releases headcount', color: '#f59e0b' },
        ]) + '</div></div>';

    h += '<div class="section"><div class="section-header"><span class="section-title">Detail</span>'
      + '<div class="spacer"></div><button class="btn btn-ghost btn-sm no-print" id="imp-export">Export CSV</button></div>'
      + '<div class="table-wrap"><table><thead><tr>'
      + '<th>Strategy delivery</th><th>Qtr</th><th>Status</th><th class="right">Likelihood</th>'
      + '<th class="right">Unlocks</th><th class="right">Releases</th><th class="right">Net</th>'
      + '<th class="right">Expected</th><th class="right">Exposure</th><th>Lines affected</th>'
      + '</tr></thead><tbody>'
      + linked.map(d => '<tr>'
        + '<td class="fw-600">' + esc(d.deliverable.name) + '</td>'
        + '<td class="nums text-dim">' + esc(d.deliverable.targetQuarter) + '</td>'
        + '<td>' + Fmt.statusBadge(d.deliverable.status) + '</td>'
        + '<td class="right nums">' + Fmt.pct(d.probability * 100) + '</td>'
        + '<td class="right nums text-green">' + (d.unlockFte ? '+' + Fmt.fte(d.unlockFte) : '—') + '</td>'
        + '<td class="right nums text-warn">' + (d.releaseFte ? '−' + Fmt.fte(d.releaseFte) : '—') + '</td>'
        + '<td class="right nums ' + Fmt.cls(d.netFte) + '">' + Fmt.fte(d.netFte, true) + '</td>'
        + '<td class="right nums ' + Fmt.cls(d.expectedFte) + '">' + Fmt.fte(d.expectedFte, true) + '</td>'
        + '<td class="right nums fw-700">' + Fmt.fte(d.exposureFte) + '</td>'
        + '<td class="small text-dim">' + d.lineIds.map(id => esc(Fmt.lineCode(id))).join(', ') + '</td>'
        + '</tr>').join('')
      + '</tbody></table></div>'
      + '<div class="footnote"><strong>Exposure</strong> ignores direction: it is the total headcount whose fate this '
      + 'delivery decides, and is the honest measure of how much rides on it. <strong>Expected</strong> weights the net '
      + 'change by likelihood. A request with several triggers is counted under each of them, so these columns do not '
      + 'sum to a plan total — use Scenarios for that.</div></div>';

    /* Requests behind each delivery, so a number can always be traced back. */
    h += '<div class="section page-break"><div class="section-header"><span class="section-title">What sits behind each delivery</span></div>';
    linked.forEach(d => {
      const reqs = Store.all('requests').filter(r => (r.links || []).some(l => l.deliverableId === d.deliverable.id));
      h += '<div class="card mb-3"><div class="flex gap-2 items-center flex-wrap" style="margin-bottom:9px">'
        + '<span class="fw-700">' + esc(d.deliverable.name) + '</span>'
        + Fmt.statusBadge(d.deliverable.status)
        + '<span class="small text-muted">' + Fmt.pct(d.probability * 100) + ' likely · target '
        + esc(d.deliverable.targetQuarter) + '</span></div>'
        + '<table><tbody>' + reqs.map(r => {
            const note = (r.links.find(l => l.deliverableId === d.deliverable.id) || {}).conditionNote;
            return '<tr><td style="width:44px" class="right nums fw-700 '
              + (r.changeType === 'Decrease' ? 'text-warn' : 'text-green') + '">'
              + (r.changeType === 'Decrease' ? '−' : '+') + Fmt.fte(r.fte) + '</td>'
              + '<td>' + esc(r.title) + '<div class="small text-muted">' + esc(Fmt.lineCode(r.lineId))
              + ' · ' + esc(Fmt.roleName(r.roleId)) + ' · from ' + esc(r.startQuarter)
              + (note ? ' · <em>' + esc(note) + '</em>' : '') + '</div></td></tr>';
          }).join('') + '</tbody></table></div>';
    });
    h += '</div>';

    const orphans = impact.filter(d => d.requestCount === 0);
    if (orphans.length) {
      h += '<div class="section"><div class="alert alert-info"><strong>'
        + orphans.length + ' delivery(ies) have no capacity riding on them:</strong> '
        + orphans.map(d => esc(d.deliverable.name)).join(', ')
        + '. Fine if they genuinely need no people — worth a second pass if not.</div></div>';
    }

    body.innerHTML = h;

    document.getElementById('imp-export').addEventListener('click', () => {
      exportCSV('deliverable-impact', [['Delivery', 'Quarter', 'Status', 'Likelihood %', 'Unlocks FTE',
        'Releases FTE', 'Net FTE', 'Expected FTE', 'Exposure FTE', 'Requests', 'Lines']]
        .concat(linked.map(d => [d.deliverable.name, d.deliverable.targetQuarter, d.deliverable.status,
          Math.round(d.probability * 100), d.unlockFte, d.releaseFte, d.netFte,
          d.expectedFte.toFixed(2), d.exposureFte, d.requestCount,
          d.lineIds.map(id => Fmt.lineCode(id)).join(' ')])));
    });
  },
});

/* ═══════════════════════════════════════════════════════════════════════════
   DATA & SETTINGS
   ═══════════════════════════════════════════════════════════════════════════ */
registerPage('settings', {
  render() {
    const m = Store.state.meta;
    return '<div class="page-header">Data &amp; Settings</div>'
      + '<div class="page-sub">Assumptions that apply across the whole plan, and where the data lives.</div>'

      + '<div class="section"><div class="section-header"><span class="section-title">Planning assumptions</span></div>'
      +   '<div class="card"><div id="set-errors"></div><div class="form-grid">'
      +     fieldHtml({ name: 'planningYear', label: 'Planning year', type: 'number', min: 2000, max: 2100, step: 1 }, m.planningYear)
      +     fieldHtml({ name: 'currency', label: 'Currency', hint: 'label only — no conversion' }, m.currency)
      +     fieldHtml({ name: 'hoursPerFteYear', label: 'Hours per FTE-year', type: 'number', min: 1, step: 10,
                        hint: 'drives the hours view' }, m.hoursPerFteYear)
      +     fieldHtml({ name: 'baseThresholdPct', label: 'Base-case likelihood threshold %', type: 'number', min: 0, max: 100, step: 5,
                        hint: 'a trigger counts in Base at or above this' }, m.baseThresholdPct)
      +     fieldHtml({ name: 'vendorUpliftPct', label: 'Vendor cost uplift %', type: 'number', min: -100, max: 500, step: 5,
                        hint: 'applied on top of the role rate' }, m.vendorUpliftPct)
      +   '</div>'
      +   '<div class="modal-actions" style="justify-content:flex-start;margin-top:16px">'
      +     '<button class="btn btn-primary" id="set-save">Save assumptions</button></div>'
      +   '</div></div>'

      + '<div class="section"><div class="section-header"><span class="section-title">Your data</span>'
      +   '<span class="section-note">saved in this browser</span></div>'
      +   '<div class="card">'
      +     '<div class="alert alert-info" style="margin-bottom:14px">'
      +       '<strong>This plan lives in this browser, on this computer.</strong> It is saved automatically as you '
      +       'work, but clearing site data, switching browser, or opening the file on another machine will not carry '
      +       'it across. <strong>Save to file</strong> is your only real backup — and the only way to move the plan '
      +       'or hand it to someone else.'
      +     '</div>'
      +     '<div class="flex gap-2 flex-wrap">'
      +       '<button class="btn btn-primary" id="data-save">Save to file</button>'
      +       '<button class="btn btn-ghost" id="data-load">Load from file</button>'
      +       '<button class="btn btn-ghost" id="data-demo">Reload demo data</button>'
      +       '<button class="btn btn-danger" id="data-clear">Clear everything</button>'
      +     '</div>'
      +     '<div id="data-stats" class="footnote"></div>'
      +   '</div></div>'

      + '<div class="section"><div class="section-header"><span class="section-title">Self-check</span>'
      +   '<span class="section-note">verifies the arithmetic against your data</span>'
      +   '<div class="spacer"></div>'
      +   '<button class="btn btn-ghost btn-sm" id="run-check">Run self-check</button></div>'
      +   '<div class="card"><div id="check-out" class="small text-dim">'
      +   'A single HTML file cannot carry a test runner, so the properties a test suite would guard are asserted '
      +   'here instead — scenario ordering, breakdowns reconciling with their totals, quarterly phasing landing on '
      +   'the annual figure. Run it after editing data in bulk, or any time a number looks wrong.'
      +   '</div></div></div>'

      + '<div class="section"><div class="section-header"><span class="section-title">How the model works</span></div>'
      +   '<div class="card small text-dim" style="line-height:1.65">'
      +     '<p style="margin-bottom:9px"><strong>Every ask is a signed change against current capacity.</strong> '
      +     'An increase adds FTE, a decrease releases it. Both can be conditional on a 2027 strategy delivery, '
      +     'which is what lets the plan answer "what if half the roadmap lands".</p>'
      +     '<p style="margin-bottom:9px"><strong>A delivery marked Delivered is certain; Cancelled is impossible.</strong> '
      +     'Anything else uses the likelihood you typed. A request with several triggers multiplies them, which '
      +     'assumes they are independent — if a sales target and the platform enabling it are really the same bet, '
      +     'the combined figure will read low. Attach the one that actually gates the headcount.</p>'
      +     '<p style="margin-bottom:9px"><strong>Headline FTE is the Q4 exit run-rate</strong>, not an average. '
      +     'Cost and hours are prorated by how much of the year a change is live, so an ask starting in Q4 adds '
      +     'full headcount but only a quarter of its annual cost.</p>'
      +     '<p><strong>Optimisation is treated as recoverable from Q1</strong> and independently of the roadmap. '
      +     'Capacity that a strategy delivery frees up belongs in Demand Requests as a decrease, not in the '
      +     'optimisable column — otherwise it is counted twice.</p>'
      +   '</div></div>';
  },

  init() {
    const fields = [
      { name: 'planningYear', type: 'number' }, { name: 'currency', type: 'text' },
      { name: 'hoursPerFteYear', type: 'number' }, { name: 'baseThresholdPct', type: 'number' },
      { name: 'vendorUpliftPct', type: 'number' },
    ];

    document.getElementById('set-save').addEventListener('click', () => {
      const v = {};
      fields.forEach(f => { v[f.name] = readField(f); });
      const errors = [];
      if (!(v.planningYear > 1999 && v.planningYear < 2101)) errors.push('Planning year looks wrong.');
      if (!v.currency || !String(v.currency).trim()) errors.push('Currency label cannot be empty.');
      if (!(v.hoursPerFteYear > 0)) errors.push('Hours per FTE-year must be greater than zero.');
      if (!(v.baseThresholdPct >= 0 && v.baseThresholdPct <= 100)) errors.push('Threshold must be between 0 and 100.');
      if (v.vendorUpliftPct == null || isNaN(v.vendorUpliftPct)) errors.push('Vendor uplift must be a number.');

      const box = document.getElementById('set-errors');
      if (errors.length) {
        box.innerHTML = '<div class="alert alert-error"><ul>' + errors.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul></div>';
        return;
      }
      v.currency = String(v.currency).trim();
      Object.assign(Store.state.meta, v);
      Store.save();
      box.innerHTML = '<div class="alert alert-ok">Saved. Every scenario has been recalculated.</div>';
      updateNavCounts();
      stats();
    });

    /* ── Data management ── */
    const stats = () => {
      const s = Store.state;
      const bytes = new Blob([Store.toJSON()]).size;
      document.getElementById('data-stats').innerHTML =
        s.businessLines.length + ' business lines · ' + s.roles.length + ' roles · '
        + s.deliverables.length + ' strategy deliveries · ' + s.baseline.length + ' capacity rows · '
        + s.requests.length + ' requests — about ' + (bytes / 1024).toFixed(1) + ' KB.';
    };
    stats();

    document.getElementById('data-save').addEventListener('click', () => {
      downloadFile('capacity-plan-' + Store.state.meta.planningYear + '-'
        + new Date().toISOString().slice(0, 10) + '.json', Store.toJSON(), 'application/json');
    });

    const fileInput = document.getElementById('file-input');
    document.getElementById('data-load').addEventListener('click', () => {
      fileInput.value = '';
      fileInput.click();
    });
    fileInput.onchange = () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const preview = JSON.parse(reader.result);
          const n = (preview.requests || []).length;
          showModal('Load <strong>' + esc(file.name) + '</strong>?<br><span class="small text-dim">'
            + n + ' request(s) in that file will replace everything currently in this browser. '
            + 'Save the current plan first if you need it.</span>', () => {
              try {
                Store.fromJSON(reader.result);
                refresh();
              } catch (e) {
                alert('That file could not be loaded: ' + e.message);
              }
            }, 'Replace');
        } catch (e) {
          alert('That does not look like a saved plan: ' + e.message);
        }
      };
      reader.readAsText(file);
    };

    document.getElementById('data-demo').addEventListener('click', () => {
      showModal('Replace everything with the demo dataset?', () => { Store.reset(true); refresh(); }, 'Reload demo');
    });

    document.getElementById('data-clear').addEventListener('click', () => {
      showModal('Delete the entire plan and start from an empty file?<br>'
        + '<span class="small text-dim">This cannot be undone unless you saved to file first.</span>',
        () => { Store.reset(false); refresh(); }, 'Delete everything');
    });

    /* ── Self-check ── */
    document.getElementById('run-check').addEventListener('click', () => {
      const results = runSelfCheck();
      const failed = results.filter(r => !r.pass);
      const out = document.getElementById('check-out');
      out.innerHTML =
        '<div class="alert alert-' + (failed.length ? 'error' : 'ok') + '">'
        + (failed.length
            ? '<strong>' + failed.length + ' of ' + results.length + ' checks failed.</strong> '
              + 'The figures on the other pages should not be trusted until this is resolved.'
            : '<strong>All ' + results.length + ' checks passed.</strong> '
              + 'Scenario ordering, breakdowns, phasing and bounds all hold on your current data.')
        + '</div>'
        + results.map(r => '<div class="check-row">'
            + '<span class="check-mark ' + (r.pass ? 'text-green' : 'text-red') + '">' + (r.pass ? '✓' : '✕') + '</span>'
            + '<span><span class="' + (r.pass ? '' : 'fw-600 text-red') + '">' + esc(r.name) + '</span>'
            + (r.detail ? '<span class="text-muted"> — ' + esc(r.detail) + '</span>' : '') + '</span></div>').join('');
    });
  },
});
