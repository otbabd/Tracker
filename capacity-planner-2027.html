<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2027 Capacity Planning</title>
<style>
/* ── Reset & tokens ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:#09090f; --surface:#0f0f1a; --surface2:#14142a; --surface3:#1e1e35;
  --border:#2a2a45; --border2:#3a3a58;
  --primary:#6366f1; --primary-bg:rgba(99,102,241,0.12); --primary-hover:#4f46e5;
  --success:#22c55e; --success-bg:rgba(34,197,94,0.10);
  --warn:#f59e0b;    --warn-bg:rgba(245,158,11,0.10);
  --danger:#ef4444;  --danger-bg:rgba(239,68,68,0.10);
  --info:#38bdf8;    --info-bg:rgba(56,189,248,0.10);
  --text:#f0f0f8; --text-dim:#94a3b8; --text-muted:#55607a;
  --radius:10px; --radius-sm:7px;
  --shadow:0 8px 32px rgba(0,0,0,0.5);
  --sidebar-w:236px; --topbar-h:56px;
  /* scenario colours, used by charts and tables alike */
  --sc-committed:#64748b; --sc-base:#6366f1; --sc-upside:#22c55e;
  --sc-downside:#f59e0b;  --sc-expected:#a855f7;
}

html { font-size:15px; scroll-behavior:smooth; }
body {
  font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ── Layout ───────────────────────────────────────────────────────────────── */
#layout { margin-left:var(--sidebar-w); min-height:100vh; display:flex; flex-direction:column; }
#content { flex:1; padding:24px 28px; max-width:1360px; width:100%; }

#sidebar {
  position:fixed; top:0; left:0; width:var(--sidebar-w); height:100vh;
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; z-index:200; overflow-y:auto;
  transition:transform .25s ease;
}
.sidebar-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 16px 14px; border-bottom:1px solid var(--border);
}
.brand { font-size:14.5px; font-weight:700; letter-spacing:-0.02em; }
.brand small { display:block; font-size:11px; font-weight:500; color:var(--text-muted); letter-spacing:0; }
.sidebar-close { display:none; background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; }

.nav { padding:10px 8px; display:flex; flex-direction:column; gap:2px; }
.nav-section { font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); padding:12px 10px 5px; font-weight:600; }
.nav-item {
  display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:var(--radius-sm);
  color:var(--text-dim); text-decoration:none; font-size:13.5px; font-weight:500; transition:background .15s,color .15s;
}
.nav-item:hover { background:var(--surface2); color:var(--text); }
.nav-item.active { background:var(--primary-bg); color:var(--primary); font-weight:600; }
.nav-icon { width:17px; height:17px; flex-shrink:0; }
.nav-count { margin-left:auto; font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums; }

#topbar {
  height:var(--topbar-h); border-bottom:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; gap:12px; padding:0 28px; position:sticky; top:0; z-index:100;
}
.topbar-title { font-size:15px; font-weight:600; }
.topbar-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
.save-state { font-size:11.5px; color:var(--text-muted); }
.save-state.saved { color:var(--success); }
.menu-btn { display:none; background:none; border:none; color:var(--text); cursor:pointer; padding:4px; }

.overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:150; }
.hidden { display:none !important; }

/* ── Typography & helpers ─────────────────────────────────────────────────── */
.page-header { font-size:20px; font-weight:700; letter-spacing:-0.02em; margin-bottom:4px; }
.page-sub { font-size:13px; color:var(--text-dim); margin-bottom:20px; max-width:76ch; }
.section { margin-bottom:26px; }
.section-header { display:flex; align-items:center; gap:12px; margin-bottom:11px; flex-wrap:wrap; }
.section-title { font-size:14.5px; font-weight:650; }
.section-note { font-size:12px; color:var(--text-muted); }
.spacer { margin-left:auto; }
.mb-6 { margin-bottom:24px; } .mb-3 { margin-bottom:12px; } .mt-4 { margin-top:16px; }
.flex { display:flex; } .gap-2 { gap:8px; } .gap-3 { gap:12px; } .flex-wrap { flex-wrap:wrap; }
.items-center { align-items:center; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
.text-green { color:var(--success); } .text-red { color:var(--danger); }
.text-warn { color:var(--warn); } .text-muted { color:var(--text-muted); }
.text-dim { color:var(--text-dim); }
.fw-600 { font-weight:600; } .fw-700 { font-weight:700; }
.nums { font-variant-numeric:tabular-nums; white-space:nowrap; }
.right { text-align:right; }
.small { font-size:12px; }

/* ── Cards & KPIs ─────────────────────────────────────────────────────────── */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:12px; }
.kpi-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 15px; }
.kpi-label { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
.kpi-value { font-size:23px; font-weight:700; margin-top:5px; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
.kpi-sub { font-size:11.5px; color:var(--text-dim); margin-top:3px; }

/* ── Tables ───────────────────────────────────────────────────────────────── */
.table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th {
  text-align:left; padding:10px 13px; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--text-muted); font-weight:600; border-bottom:1px solid var(--border); white-space:nowrap;
  background:var(--surface);
}
th.right, td.right { text-align:right; }
td { padding:10px 13px; border-bottom:1px solid var(--surface3); vertical-align:middle; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover { background:var(--surface2); }
tr.clickable { cursor:pointer; }
tfoot td { padding:10px 13px; border-top:1px solid var(--border2); font-weight:700; background:var(--surface2); }
.cell-actions { display:flex; gap:6px; justify-content:flex-end; }
.empty-state { padding:34px 20px; text-align:center; color:var(--text-muted); font-size:13px; }
.empty-state a { color:var(--primary); }

/* ── Badges ───────────────────────────────────────────────────────────────── */
.badge {
  display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px;
  font-weight:600; white-space:nowrap; line-height:1.5;
}
.badge-increase { background:var(--success-bg); color:var(--success); }
.badge-decrease { background:var(--warn-bg);    color:var(--warn); }
.badge-committed{ background:var(--primary-bg); color:var(--primary); }
.badge-contingent{background:var(--info-bg);    color:var(--info); }
.badge-internal { background:var(--surface3);   color:var(--text-dim); }
.badge-vendor   { background:rgba(168,85,247,.12); color:#c084fc; }
.badge-neutral  { background:var(--surface3);   color:var(--text-dim); }
.badge-delivered{ background:var(--success-bg); color:var(--success); }
.badge-progress { background:var(--info-bg);    color:var(--info); }
.badge-planned  { background:var(--surface3);   color:var(--text-dim); }
.badge-risk     { background:var(--warn-bg);    color:var(--warn); }
.badge-cancelled{ background:var(--danger-bg);  color:var(--danger); }

/* ── Forms ────────────────────────────────────────────────────────────────── */
.form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
.field { display:flex; flex-direction:column; gap:5px; }
.field.full { grid-column:1/-1; }
label { font-size:12px; font-weight:600; color:var(--text-dim); }
label .hint { font-weight:400; color:var(--text-muted); }
input, select, textarea {
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  padding:9px 11px; border-radius:var(--radius-sm); font-size:13.5px; font-family:inherit; width:100%;
}
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary); }
textarea { resize:vertical; min-height:62px; }
input[type=range] { padding:0; background:transparent; border:none; accent-color:var(--primary); }
.field-error { font-size:11.5px; color:var(--danger); }

.btn {
  padding:8px 15px; border-radius:var(--radius-sm); border:1px solid transparent; cursor:pointer;
  font-size:13px; font-weight:600; font-family:inherit; transition:background .15s,border-color .15s;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-hover); }
.btn-ghost { background:transparent; color:var(--text-dim); border-color:var(--border2); }
.btn-ghost:hover { background:var(--surface2); color:var(--text); }
.btn-danger { background:var(--danger); color:#fff; }
.btn-sm { padding:5px 10px; font-size:12px; }
.btn-icon { padding:5px 8px; font-size:12px; background:transparent; border-color:var(--border2); color:var(--text-dim); }
.btn-icon:hover { background:var(--surface2); color:var(--text); }

.toggle-group { display:inline-flex; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
.toggle-btn { background:none; border:none; color:var(--text-dim); padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
.toggle-btn.active { background:var(--primary); color:#fff; }

.alert { padding:11px 14px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:14px; border:1px solid; }
.alert-error { background:var(--danger-bg); border-color:rgba(239,68,68,.35); color:#fca5a5; }
.alert-ok    { background:var(--success-bg); border-color:rgba(34,197,94,.35); color:#86efac; }
.alert-warn  { background:var(--warn-bg); border-color:rgba(245,158,11,.35); color:#fcd34d; }
.alert-info  { background:var(--primary-bg); border-color:rgba(99,102,241,.35); color:#a5b4fc; }
.alert ul { margin:6px 0 0 18px; }

/* ── Modal ────────────────────────────────────────────────────────────────── */
.modal { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal-box { background:var(--surface); border:1px solid var(--border2); border-radius:var(--radius); padding:22px; max-width:460px; width:100%; box-shadow:var(--shadow); }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }

/* ── Charts & meters ──────────────────────────────────────────────────────── */
.chart-wrap { width:100%; overflow-x:auto; }
.chart-wrap svg { display:block; max-width:100%; height:auto; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-dim); margin-top:10px; }
.legend-item { display:flex; align-items:center; gap:6px; }
.legend-swatch { width:11px; height:11px; border-radius:3px; flex-shrink:0; }

.meter { height:6px; background:var(--surface3); border-radius:4px; overflow:hidden; min-width:64px; }
.meter-fill { height:100%; border-radius:4px; }

.linkchip {
  display:inline-flex; align-items:center; gap:5px; background:var(--surface3); color:var(--text-dim);
  padding:2px 8px; border-radius:20px; font-size:11px; margin:2px 3px 2px 0;
}
.linkchip.unlock { background:var(--success-bg); color:var(--success); }
.linkchip.release{ background:var(--warn-bg); color:var(--warn); }
.linkchip button { background:none; border:none; color:inherit; cursor:pointer; font-size:12px; padding:0 0 0 2px; line-height:1; }

.footnote { font-size:11.5px; color:var(--text-muted); margin-top:9px; max-width:82ch; }
.check-row { display:flex; gap:9px; align-items:flex-start; font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--surface3); }
.check-row:last-child { border-bottom:none; }
.check-mark { flex-shrink:0; font-weight:700; width:16px; }

/* ── Responsive ───────────────────────────────────────────────────────────── */
@media (max-width:900px) {
  #sidebar { transform:translateX(-100%); }
  #sidebar.open { transform:translateX(0); }
  .sidebar-close, .menu-btn { display:block; }
  #layout { margin-left:0; }
  #content { padding:18px 16px; }
  #topbar { padding:0 16px; }
  .grid-2, .grid-3 { grid-template-columns:1fr; }
}
@media (min-width:901px) { .overlay { display:none !important; } }

/* ── Print: board pack ────────────────────────────────────────────────────── */
@media print {
  :root { --bg:#fff; --surface:#fff; --surface2:#fff; --surface3:#eee;
          --border:#ccc; --border2:#999; --text:#000; --text-dim:#333; --text-muted:#666; }
  body { background:#fff; color:#000; }
  #sidebar, #topbar, .overlay, .modal, .no-print, .btn, .toggle-group, .cell-actions { display:none !important; }
  #layout { margin-left:0; }
  #content { padding:0; max-width:none; }
  .section { break-inside:avoid; page-break-inside:avoid; margin-bottom:18px; }
  .card, .table-wrap, .kpi-card { border:1px solid #ccc; box-shadow:none; }
  .page-break { break-before:page; page-break-before:always; }
  table { font-size:10px; } th, td { padding:5px 7px; }
  .kpi-value { font-size:18px; }
  a { text-decoration:none; color:#000; }
}
</style>
</head>

<input type="file" id="file-input" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════════════════════════════════════════ */
const QUARTERS      = ['Q1', 'Q2', 'Q3', 'Q4'];
const CATEGORIES    = ['Sales', 'Technology', 'Regulatory', 'Process'];
const DLV_STATUSES  = ['Planned', 'In Progress', 'Delivered', 'At Risk', 'Cancelled'];
const REQ_STATUSES  = ['Draft', 'Submitted', 'Under Review', 'Approved', 'Rejected', 'Deferred'];
const CHANGE_TYPES  = ['Increase', 'Decrease'];
const COMMITMENTS   = ['Committed', 'Contingent'];
const SOURCINGS     = ['Internal', 'Vendor'];
const SCENARIOS     = ['Committed', 'Base', 'Upside', 'Downside', 'Expected'];

const SCENARIO_COLOR = {
  Committed: '#64748b', Base: '#6366f1', Upside: '#22c55e',
  Downside: '#f59e0b',  Expected: '#a855f7',
};

const SCENARIO_BLURB = {
  Committed: 'Only asks with no strategic condition attached. The floor — what you need even if nothing on the 2027 roadmap lands.',
  Base:      'Committed, plus every conditional ask whose triggers clear the likelihood threshold. The planning number.',
  Upside:    'Every increase lands; only redundancies already banked are counted. Maximum capacity need.',
  Downside:  'Only increases already banked; every redundancy lands. Minimum capacity need.',
  Expected:  'Each conditional ask weighted by the probability of its triggers. Not a world that happens — the average across all of them.',
};

const STORAGE_KEY = 'capacityPlanner.v1';

/* ═══════════════════════════════════════════════════════════════════════════
   STORE  —  state, persistence, JSON import/export
   ═══════════════════════════════════════════════════════════════════════════ */
function uid(prefix) {
  return prefix + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
}

const DEFAULT_META = {
  planningYear: 2027,
  currency: 'SAR',
  hoursPerFteYear: 1800,
  baseThresholdPct: 70,
  vendorUpliftPct: 0,
};

function emptyState() {
  return {
    meta: Object.assign({}, DEFAULT_META),
    businessLines: [], roles: [], deliverables: [], baseline: [], requests: [],
  };
}

const Store = {
  state: emptyState(),
  _saveTimer: null,

  load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); }
    catch (e) { console.warn('localStorage unavailable — running in memory only', e); }

    if (raw) {
      try {
        this.state = this.normalise(JSON.parse(raw));
        return 'restored';
      } catch (e) {
        console.error('Stored data was corrupt; starting from the demo set.', e);
      }
    }
    this.state = this.normalise(buildSeed());
    this.save();
    return 'seeded';
  },

  /* Fills in anything a hand-edited or older JSON file might be missing, so a
     partial import cannot leave the app in a half-broken state. */
  normalise(raw) {
    const s = emptyState();
    if (!raw || typeof raw !== 'object') return s;
    s.meta = Object.assign({}, DEFAULT_META, raw.meta || {});
    ['businessLines', 'roles', 'deliverables', 'baseline', 'requests'].forEach(k => {
      s[k] = Array.isArray(raw[k]) ? raw[k] : [];
    });
    s.requests.forEach(r => {
      if (!Array.isArray(r.links)) r.links = [];
      r.fte = Math.abs(Number(r.fte) || 0);
    });
    s.baseline.forEach(b => {
      b.fte = Number(b.fte) || 0;
      b.fteOptimizable = Number(b.fteOptimizable) || 0;
      if (b.utilizationPct == null) b.utilizationPct = 100;
    });
    s.deliverables.forEach(d => {
      d.likelihoodPct = Math.max(0, Math.min(100, Number(d.likelihoodPct) || 0));
    });
    return s;
  },

  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      flashSaved();
    } catch (e) {
      console.warn('Could not persist to localStorage', e);
      setSaveState('Not saved — storage blocked', false);
    }
  },

  /* Debounced so typing in a form does not hammer localStorage. */
  touch() {
    clearTimeout(this._saveTimer);
    this._saveTimer = setTimeout(() => this.save(), 250);
  },

  reset(seeded) {
    this.state = this.normalise(seeded ? buildSeed() : emptyState());
    this.save();
  },

  /* ── collection helpers ── */
  all(k)      { return this.state[k]; },
  byId(k, id) { return this.state[k].find(x => x.id === id) || null; },

  add(k, obj) {
    obj.id = obj.id || uid(k.slice(0, 3));
    this.state[k].push(obj);
    this.save();
    return obj;
  },

  update(k, id, patch) {
    const item = this.byId(k, id);
    if (!item) return null;
    Object.assign(item, patch);
    this.save();
    return item;
  },

  /* Removing a record prunes anything that pointed at it, so the model can
     never hold a dangling reference. */
  remove(k, id) {
    this.state[k] = this.state[k].filter(x => x.id !== id);

    if (k === 'deliverables') {
      this.state.requests.forEach(r => {
        r.links = r.links.filter(l => l.deliverableId !== id);
      });
    }
    if (k === 'businessLines') {
      this.state.baseline = this.state.baseline.filter(b => b.lineId !== id);
      this.state.requests = this.state.requests.filter(r => r.lineId !== id);
    }
    if (k === 'roles') {
      this.state.baseline.forEach(b => { if (b.roleId === id) b.roleId = null; });
      this.state.requests.forEach(r => { if (r.roleId === id) r.roleId = null; });
    }
    this.save();
  },

  /* ── file I/O ── */
  toJSON() {
    return JSON.stringify({
      _format: 'capacity-planner',
      _version: 1,
      _exportedAt: new Date().toISOString(),
      meta: this.state.meta,
      businessLines: this.state.businessLines,
      roles: this.state.roles,
      deliverables: this.state.deliverables,
      baseline: this.state.baseline,
      requests: this.state.requests,
    }, null, 2);
  },

  fromJSON(text) {
    const parsed = JSON.parse(text);
    this.state = this.normalise(parsed);
    this.save();
  },
};

/* ═══════════════════════════════════════════════════════════════════════════
   FORMATTERS
   ═══════════════════════════════════════════════════════════════════════════ */
const Fmt = {
  fte(v, sign) {
    if (v == null || isNaN(v)) return '—';
    const n = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    if (sign) return (v > 0 ? '+' : v < 0 ? '−' : '') + n;
    return (v < 0 ? '−' : '') + n;
  },

  money(v, sign) {
    if (v == null || isNaN(v)) return '—';
    const cur = Store.state.meta.currency;
    const abs = Math.abs(v);
    /* Big planning numbers are unreadable in full; compact them above 1M. */
    let n;
    if (abs >= 1e6)      n = (abs / 1e6).toLocaleString('en-US', { maximumFractionDigits: 2 }) + 'M';
    else if (abs >= 1e4) n = (abs / 1e3).toLocaleString('en-US', { maximumFractionDigits: 0 }) + 'k';
    else                 n = abs.toLocaleString('en-US', { maximumFractionDigits: 0 });
    const prefix = sign ? (v > 0 ? '+' : v < 0 ? '−' : '') : (v < 0 ? '−' : '');
    return prefix + cur + ' ' + n;
  },

  moneyFull(v) {
    if (v == null || isNaN(v)) return '—';
    return Store.state.meta.currency + ' ' +
      Math.round(v).toLocaleString('en-US');
  },

  hours(v) {
    if (v == null || isNaN(v)) return '—';
    const abs = Math.abs(v);
    const n = abs >= 1000 ? (abs / 1000).toLocaleString('en-US', { maximumFractionDigits: 1 }) + 'k'
                          : abs.toLocaleString('en-US', { maximumFractionDigits: 0 });
    return (v < 0 ? '−' : '') + n + ' h';
  },

  pct(v, digits)  { return v == null || isNaN(v) ? '—' : v.toFixed(digits == null ? 0 : digits) + '%'; },
  num(v, d)       { return v == null || isNaN(v) ? '—' : v.toLocaleString('en-US', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); },
  cls(v)          { return v > 0 ? 'text-green' : v < 0 ? 'text-red' : ''; },
  quarter(q)      { return Store.state.meta.planningYear + ' ' + q; },

  /* Name lookups — records reference each other by id only. */
  lineName(id) { const l = Store.byId('businessLines', id); return l ? l.name : '—'; },
  lineCode(id) { const l = Store.byId('businessLines', id); return l ? l.code : '—'; },
  roleName(id) { const r = Store.byId('roles', id); return r ? r.title : '—'; },
  dlvName(id)  { const d = Store.byId('deliverables', id); return d ? d.name : '(deleted)'; },

  badge(text, kind) {
    return '<span class="badge badge-' + (kind || 'neutral') + '">' + esc(text) + '</span>';
  },

  statusBadge(status) {
    const map = {
      'Delivered': 'delivered', 'In Progress': 'progress', 'Planned': 'planned',
      'At Risk': 'risk', 'Cancelled': 'cancelled',
      'Approved': 'delivered', 'Submitted': 'progress', 'Under Review': 'progress',
      'Draft': 'planned', 'Rejected': 'cancelled', 'Deferred': 'risk',
    };
    return Fmt.badge(status, map[status] || 'neutral');
  },
};

/* Every value that reaches innerHTML goes through this — free-text fields like
   justification and notes would otherwise be able to inject markup. */
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ═══════════════════════════════════════════════════════════════════════════
   PLANNING ENGINE

   Pure functions over Store.state — no DOM, no side effects. Everything the
   tool asserts about 2027 is computed here, so this is the part to read if you
   want to check the numbers rather than trust them.
   ═══════════════════════════════════════════════════════════════════════════ */
const Planning = {

  /* ── Probability ──────────────────────────────────────────────────────── */

  /* A delivery that has landed is certain; one that is cancelled is impossible.
     Everything else is the planner's own estimate. */
  effectiveProbability(dlv) {
    if (!dlv) return 0;                       // link to a deleted delivery
    if (dlv.status === 'Delivered') return 1;
    if (dlv.status === 'Cancelled') return 0;
    return Math.max(0, Math.min(1, (Number(dlv.likelihoodPct) || 0) / 100));
  },

  /* Combined probability of every trigger on a request holding.

     Marking a request Committed is an explicit override: the planner is saying
     it happens regardless of the roadmap, so any links it carries are ignored
     (and flagged as a data-quality warning). Without this override, a request
     could sit inside the Committed scenario but fall out of Base, which would
     make the two incomparable. */
  combinedProbability(req) {
    if (req.commitment === 'Committed') return 1;
    if (!req.links || !req.links.length) return 1;
    return req.links.reduce(
      (p, l) => p * this.effectiveProbability(Store.byId('deliverables', l.deliverableId)),
      1
    );
  },

  /* ── Scenario inclusion ───────────────────────────────────────────────── */

  /* How much of a request each scenario counts, from 0 to 1.

     Note the asymmetry between increases and decreases: "Upside" means the
     world where you need the MOST people, so it takes every plausible increase
     but only the redundancies already banked. Downside is its exact mirror.

     "Plausible" is doing real work there: a request whose trigger has been
     cancelled has p = 0 and drops out of every scenario, including the two
     cells that otherwise take everything. A dead deliverable cannot unlock
     headcount, and it cannot make anyone redundant either. */
  inclusionFactor(req, scenario, thresholdPct) {
    const p = this.combinedProbability(req);
    const t = (thresholdPct == null ? Store.state.meta.baseThresholdPct : thresholdPct) / 100;
    const isIncrease = req.changeType !== 'Decrease';
    const possible = p > 0 ? 1 : 0;
    const banked   = p >= 1 ? 1 : 0;

    switch (scenario) {
      case 'Committed': return req.commitment === 'Committed' ? 1 : 0;
      case 'Base':      return p >= t ? 1 : 0;
      case 'Upside':    return isIncrease ? possible : banked;
      case 'Downside':  return isIncrease ? banked   : possible;
      case 'Expected':  return p;
      default:          return 0;
    }
  },

  /* ── Timing ───────────────────────────────────────────────────────────── */

  quarterIndex(q) {
    const i = QUARTERS.indexOf(q);
    return i < 0 ? 1 : i + 1;                 // unknown / missing → start of year
  },

  /* A request starting in Q3 is only live for half the year, so it costs half
     an annual salary even though it adds full FTE to the Q4 run-rate. */
  quartersActive(q) { return 5 - this.quarterIndex(q); },

  /* ── Unit conversion ──────────────────────────────────────────────────── */

  roleCost(roleId, sourcing) {
    const role = Store.byId('roles', roleId);
    if (!role) return 0;                      // flagged by coverageWarnings
    const base = Number(role.annualCost) || 0;
    const uplift = sourcing === 'Vendor'
      ? 1 + (Number(Store.state.meta.vendorUpliftPct) || 0) / 100
      : 1;
    return base * uplift;
  },

  /* ── Resolving one request under one scenario ─────────────────────────── */

  resolveRequest(req, scenario, thresholdPct) {
    const probability = this.combinedProbability(req);
    const factor      = this.inclusionFactor(req, scenario, thresholdPct);
    const sign        = req.changeType === 'Decrease' ? -1 : 1;
    const magnitude   = Math.abs(Number(req.fte) || 0);
    const signedFte   = sign * magnitude * factor;

    const qActive = this.quartersActive(req.startQuarter);
    const startIx = this.quarterIndex(req.startQuarter);
    const hoursPerFte = Number(Store.state.meta.hoursPerFteYear) || 0;

    return {
      request: req,
      probability,
      factor,
      signedFte,
      quartersActive: qActive,
      annualCost:  signedFte * this.roleCost(req.roleId, req.sourcing) * qActive / 4,
      annualHours: signedFte * hoursPerFte * qActive / 4,
      /* Headcount present in each quarter — a request is live from its start
         quarter through year end, at full FTE. */
      fteByQuarter: QUARTERS.map((_, i) => (i + 1) >= startIx ? signedFte : 0),
    };
  },

  resolveBaselineRow(row) {
    const cost  = this.roleCost(row.roleId, row.sourcing);
    const hours = Number(Store.state.meta.hoursPerFteYear) || 0;
    const fte   = Number(row.fte) || 0;
    const opt   = Math.min(Number(row.fteOptimizable) || 0, fte);   // cannot release more than exists
    return {
      row, fte, optimizable: opt,
      cost: fte * cost,   optimizableCost: opt * cost,
      hours: fte * hours, optimizableHours: opt * hours,
    };
  },

  /* ── Rollup ───────────────────────────────────────────────────────────── */

  /* The whole 2027 position under one scenario, sliced every way the UI needs.
     opts.thresholdPct overrides the saved Base threshold (used by the slider);
     opts.lineId narrows everything to a single business line. */
  scenarioRollup(scenario, opts) {
    opts = opts || {};
    const threshold = opts.thresholdPct;

    let baseline = Store.all('baseline');
    let requests = Store.all('requests');
    if (opts.lineId) {
      baseline = baseline.filter(b => b.lineId === opts.lineId);
      requests = requests.filter(r => r.lineId === opts.lineId);
    }

    const blank = () => ({
      baselineFte: 0, optimizableFte: 0, increaseFte: 0, decreaseFte: 0,
      baselineCost: 0, optimizableCost: 0, deltaCost: 0,
      baselineHours: 0, optimizableHours: 0, deltaHours: 0,
    });

    const total   = blank();
    const byLine  = new Map();
    const byRole  = new Map();
    const bySrc   = { Internal: blank(), Vendor: blank() };
    const quarterDelta = [0, 0, 0, 0];

    const bucket = (map, key) => {
      if (!map.has(key)) map.set(key, Object.assign({ key: key }, blank()));
      return map.get(key);
    };
    const addBaseline = (t, r) => {
      t.baselineFte += r.fte;            t.optimizableFte   += r.optimizable;
      t.baselineCost += r.cost;          t.optimizableCost  += r.optimizableCost;
      t.baselineHours += r.hours;        t.optimizableHours += r.optimizableHours;
    };
    const addDelta = (t, r) => {
      if (r.signedFte >= 0) t.increaseFte += r.signedFte;
      else                  t.decreaseFte += r.signedFte;   // stays negative
      t.deltaCost  += r.annualCost;
      t.deltaHours += r.annualHours;
    };

    baseline.forEach(row => {
      const r = this.resolveBaselineRow(row);
      addBaseline(total, r);
      addBaseline(bucket(byLine, row.lineId), r);
      addBaseline(bucket(byRole, row.roleId), r);
      addBaseline(bySrc[row.sourcing === 'Vendor' ? 'Vendor' : 'Internal'], r);
    });

    const resolved = requests.map(req => this.resolveRequest(req, scenario, threshold));
    resolved.forEach(r => {
      addDelta(total, r);
      addDelta(bucket(byLine, r.request.lineId), r);
      addDelta(bucket(byRole, r.request.roleId), r);
      addDelta(bySrc[r.request.sourcing === 'Vendor' ? 'Vendor' : 'Internal'], r);
      r.fteByQuarter.forEach((v, i) => { quarterDelta[i] += v; });
    });

    /* Derived figures, applied identically to the total and every slice. */
    const finish = (t) => {
      t.netDeltaFte        = t.increaseFte + t.decreaseFte;
      t.optimizedBaselineFte = t.baselineFte - t.optimizableFte;
      t.requirementFte     = t.optimizedBaselineFte + t.netDeltaFte;
      t.gapFte             = t.requirementFte - t.baselineFte;

      t.optimizedBaselineCost = t.baselineCost - t.optimizableCost;
      t.requirementCost       = t.optimizedBaselineCost + t.deltaCost;
      t.optimizedBaselineHours = t.baselineHours - t.optimizableHours;
      t.requirementHours       = t.optimizedBaselineHours + t.deltaHours;
      return t;
    };

    finish(total);
    byLine.forEach(finish);
    byRole.forEach(finish);
    finish(bySrc.Internal);
    finish(bySrc.Vendor);

    /* Optimization is treated as realised from the start of the year — it is a
       decision about existing capacity, not something the roadmap gates. */
    const byQuarter = QUARTERS.map((q, i) => ({
      quarter: q,
      fte: total.optimizedBaselineFte + quarterDelta[i],
      delta: quarterDelta[i],
    }));

    return Object.assign(total, {
      scenario: scenario,
      byLine:   Array.from(byLine.values()).sort((a, b) => b.requirementFte - a.requirementFte),
      byRole:   Array.from(byRole.values()).sort((a, b) => b.requirementFte - a.requirementFte),
      bySourcing: bySrc,
      byQuarter: byQuarter,
      resolved: resolved,
      /* Gross magnitudes, ignoring sign — used by the self-check to compare
         scenarios that are not comparable on net alone. */
      grossIncreaseFte: total.increaseFte,
      grossDecreaseFte: Math.abs(total.decreaseFte),
    });
  },

  allScenarios(opts) {
    return SCENARIOS.map(s => this.scenarioRollup(s, opts));
  },

  /* ── Deliverable impact ───────────────────────────────────────────────── */

  /* Per strategy delivery: how much headcount is riding on it, in both
     directions. A request with several triggers appears under each of them, so
     these columns describe exposure, not an additive total. */
  deliverableImpact() {
    return Store.all('deliverables').map(dlv => {
      const linked = Store.all('requests').filter(
        r => (r.links || []).some(l => l.deliverableId === dlv.id)
      );
      const p = this.effectiveProbability(dlv);

      let unlockFte = 0, releaseFte = 0, expectedFte = 0, atStakeCost = 0;
      const lines = new Set();

      linked.forEach(r => {
        const mag  = Math.abs(Number(r.fte) || 0);
        const sign = r.changeType === 'Decrease' ? -1 : 1;
        if (sign > 0) unlockFte += mag; else releaseFte += mag;
        expectedFte += sign * mag * this.combinedProbability(r);
        atStakeCost += sign * mag * this.roleCost(r.roleId, r.sourcing)
                     * this.quartersActive(r.startQuarter) / 4;
        if (r.lineId) lines.add(r.lineId);
      });

      return {
        deliverable: dlv,
        probability: p,
        requestCount: linked.length,
        unlockFte, releaseFte,
        netFte: unlockFte - releaseFte,
        expectedFte,
        atStakeCost,
        lineIds: Array.from(lines),
        /* Ignoring sign: the total headcount whose fate this delivery decides. */
        exposureFte: unlockFte + releaseFte,
      };
    }).sort((a, b) => b.exposureFte - a.exposureFte);
  },

  /* ── Optimization view ────────────────────────────────────────────────── */

  optimizationSummary() {
    const map = new Map();
    Store.all('baseline').forEach(row => {
      const k = row.lineId;
      if (!map.has(k)) map.set(k, { lineId: k, fte: 0, optimizable: 0, cost: 0,
                                    optimizableCost: 0, weightedUtil: 0, rows: 0, underUtilised: 0 });
      const t = map.get(k);
      const r = this.resolveBaselineRow(row);
      const util = Number(row.utilizationPct) || 0;
      t.fte += r.fte;
      t.optimizable += r.optimizable;
      t.cost += r.cost;
      t.optimizableCost += r.optimizableCost;
      t.weightedUtil += util * r.fte;         // weight by FTE, not by row count
      t.rows += 1;
      if (util < 80) t.underUtilised += 1;
    });

    return Array.from(map.values()).map(t => Object.assign(t, {
      avgUtilization: t.fte > 0 ? t.weightedUtil / t.fte : 0,
      optimizablePct: t.fte > 0 ? (t.optimizable / t.fte) * 100 : 0,
    })).sort((a, b) => b.optimizable - a.optimizable);
  },

  /* ── Data quality ─────────────────────────────────────────────────────── */

  /* Things that will quietly distort the numbers if left alone. Surfaced on the
     dashboard rather than buried, because every one of them is a silent zero
     somewhere in a rollup. */
  coverageWarnings() {
    const w = [];
    const requests = Store.all('requests');
    const push = (level, text) => w.push({ level, text });

    const contingentNoLink = requests.filter(
      r => r.commitment === 'Contingent' && (!r.links || !r.links.length)
    );
    if (contingentNoLink.length) {
      push('warn', contingentNoLink.length + ' contingent request(s) have no strategy delivery attached, '
        + 'so nothing gates them — they currently behave as committed in every scenario except Committed.');
    }

    const committedWithLinks = requests.filter(
      r => r.commitment === 'Committed' && r.links && r.links.length
    );
    if (committedWithLinks.length) {
      push('info', committedWithLinks.length + ' request(s) are marked Committed but still carry triggers. '
        + 'Committed overrides the condition, so those links are ignored in every scenario.');
    }

    const noRole = requests.filter(r => !r.roleId || !Store.byId('roles', r.roleId));
    if (noRole.length) {
      push('warn', noRole.length + ' request(s) have no role, so they contribute FTE but '
        + Store.state.meta.currency + ' 0 to every cost figure.');
    }

    const baselineNoRole = Store.all('baseline').filter(b => !b.roleId || !Store.byId('roles', b.roleId));
    if (baselineNoRole.length) {
      push('warn', baselineNoRole.length + ' existing-capacity row(s) have no role and cost nothing in the rollups.');
    }

    const zeroFte = requests.filter(r => !(Math.abs(Number(r.fte) || 0) > 0));
    if (zeroFte.length) push('info', zeroFte.length + ' request(s) are recorded at 0 FTE.');

    const orphanDlv = Store.all('deliverables').filter(
      d => !requests.some(r => (r.links || []).some(l => l.deliverableId === d.id))
    );
    if (orphanDlv.length) {
      push('info', orphanDlv.length + ' strategy delivery(ies) have no capacity riding on them. '
        + 'Fine if true — worth a second look if not.');
    }

    const overOptimised = Store.all('baseline').filter(
      b => (Number(b.fteOptimizable) || 0) > (Number(b.fte) || 0)
    );
    if (overOptimised.length) {
      push('warn', overOptimised.length + ' capacity row(s) claim more optimisable FTE than they hold. '
        + 'The excess is capped in the rollups.');
    }

    const stalled = Store.all('deliverables').filter(
      d => d.status !== 'Cancelled' && (Number(d.likelihoodPct) || 0) === 0
    );
    if (stalled.length) {
      push('info', stalled.length + ' delivery(ies) sit at 0% likelihood without being cancelled. '
        + 'Anything depending on them is excluded from Base, Upside and Expected.');
    }

    return w;
  },
};

/* ═══════════════════════════════════════════════════════════════════════════
   SELF-CHECK

   A single HTML file cannot host a test runner, so the invariants that a unit
   suite would guard are asserted here against whatever data is loaded, and run
   from Data & Settings. If one of these fails, a number on the dashboard is
   wrong — not merely surprising.
   ═══════════════════════════════════════════════════════════════════════════ */
const EPS = 1e-6;
const near = (a, b) => Math.abs(a - b) < Math.max(EPS, Math.abs(a) * 1e-9);
const lte  = (a, b) => a - b < EPS;

function runSelfCheck() {
  const results = [];
  const check = (name, pass, detail) => results.push({ name, pass: !!pass, detail: detail || '' });

  let sc;
  try {
    sc = {};
    SCENARIOS.forEach(s => { sc[s] = Planning.scenarioRollup(s); });
  } catch (e) {
    check('Scenario engine runs without error', false, e.message);
    return results;
  }
  check('Scenario engine runs without error', true);

  /* ── 1. Ordering ──────────────────────────────────────────────────────────
     Downside is the world needing fewest people, Upside the most, and the
     probability-weighted Expected case must sit between them. This is the
     invariant most likely to break if the inclusion table is edited. */
  const ordered = lte(sc.Downside.requirementFte, sc.Expected.requirementFte)
               && lte(sc.Expected.requirementFte, sc.Upside.requirementFte);
  check('Downside ≤ Expected ≤ Upside (total FTE)', ordered,
    Fmt.fte(sc.Downside.requirementFte) + ' ≤ ' + Fmt.fte(sc.Expected.requirementFte)
    + ' ≤ ' + Fmt.fte(sc.Upside.requirementFte));

  const badLines = [];
  Store.all('businessLines').forEach(line => {
    const d = Planning.scenarioRollup('Downside', { lineId: line.id }).requirementFte;
    const e = Planning.scenarioRollup('Expected', { lineId: line.id }).requirementFte;
    const u = Planning.scenarioRollup('Upside',   { lineId: line.id }).requirementFte;
    if (!(lte(d, e) && lte(e, u))) badLines.push(line.code);
  });
  check('Downside ≤ Expected ≤ Upside (every business line)', badLines.length === 0,
    badLines.length ? 'Violated in: ' + badLines.join(', ') : Store.all('businessLines').length + ' lines checked');

  /* ── 2. Committed ⊆ Base ──────────────────────────────────────────────────
     Deliberately NOT asserted on net FTE. Base also picks up likely
     redundancies, so its net can legitimately fall below Committed. What must
     hold is set containment: everything Committed counts, Base counts too. */
  check('Committed increases are all inside Base',
    lte(sc.Committed.grossIncreaseFte, sc.Base.grossIncreaseFte),
    Fmt.fte(sc.Committed.grossIncreaseFte) + ' ≤ ' + Fmt.fte(sc.Base.grossIncreaseFte));
  check('Committed decreases are all inside Base',
    lte(sc.Committed.grossDecreaseFte, sc.Base.grossDecreaseFte),
    Fmt.fte(sc.Committed.grossDecreaseFte) + ' ≤ ' + Fmt.fte(sc.Base.grossDecreaseFte));

  /* ── 3. Breakdowns reconcile with their totals ── */
  const sumOf = (arr, key) => arr.reduce((n, x) => n + x[key], 0);
  SCENARIOS.forEach(s => {
    const r = sc[s];
    check(s + ': by-line breakdown sums to the total',
      near(sumOf(r.byLine, 'requirementFte'), r.requirementFte),
      Fmt.fte(sumOf(r.byLine, 'requirementFte')) + ' vs ' + Fmt.fte(r.requirementFte));
    check(s + ': by-role breakdown sums to the total',
      near(sumOf(r.byRole, 'requirementFte'), r.requirementFte),
      Fmt.fte(sumOf(r.byRole, 'requirementFte')) + ' vs ' + Fmt.fte(r.requirementFte));
    check(s + ': Internal + Vendor sums to the total',
      near(r.bySourcing.Internal.requirementFte + r.bySourcing.Vendor.requirementFte, r.requirementFte));
    check(s + ': cost breakdown sums to the total',
      near(sumOf(r.byLine, 'requirementCost'), r.requirementCost),
      Fmt.money(sumOf(r.byLine, 'requirementCost')) + ' vs ' + Fmt.money(r.requirementCost));
  });

  /* ── 4. Quarterly phasing lands on the annual figure ──────────────────────
     Every request is live by Q4, so the Q4 run-rate is the year-end
     requirement. If these diverge, phasing is dropping or double-counting. */
  SCENARIOS.forEach(s => {
    const q4 = sc[s].byQuarter[3].fte;
    check(s + ': Q4 run-rate equals the annual requirement', near(q4, sc[s].requirementFte),
      Fmt.fte(q4) + ' vs ' + Fmt.fte(sc[s].requirementFte));
  });

  /* ── 5. Bounds ── */
  let factorOk = true, probOk = true;
  Store.all('requests').forEach(req => {
    const p = Planning.combinedProbability(req);
    if (!(p >= -EPS && p <= 1 + EPS)) probOk = false;
    SCENARIOS.forEach(s => {
      const f = Planning.inclusionFactor(req, s);
      if (!(f >= -EPS && f <= 1 + EPS)) factorOk = false;
    });
  });
  check('Every trigger probability is between 0 and 1', probOk);
  check('Every inclusion factor is between 0 and 1', factorOk);

  /* ── 6. A cancelled trigger kills its request everywhere ── */
  const deadTriggered = Store.all('requests').filter(
    r => r.commitment !== 'Committed' && Planning.combinedProbability(r) === 0
  );
  let deadOk = true;
  deadTriggered.forEach(r => {
    SCENARIOS.forEach(s => {
      if (Planning.inclusionFactor(r, s) !== 0) deadOk = false;
    });
  });
  check('Requests on a cancelled or 0% trigger are excluded from all five scenarios', deadOk,
    deadTriggered.length + ' such request(s) found');

  /* ── 7. You cannot optimise away capacity you do not have ── */
  const capped = Store.all('baseline').every(row => {
    const r = Planning.resolveBaselineRow(row);
    return lte(r.optimizable, r.fte);
  });
  check('Optimisable FTE never exceeds the capacity it sits in', capped);

  /* ── 8. Committed carries nothing conditional ── */
  const committedClean = sc.Committed.resolved
    .filter(r => r.factor > 0)
    .every(r => r.request.commitment === 'Committed');
  check('The Committed scenario contains only committed requests', committedClean);

  return results;
}

/* ═══════════════════════════════════════════════════════════════════════════
   CHARTS

   Hand-rolled inline SVG. A charting library would be one CDN link, but that
   link is also the one thing that can stop this file working offline or in
   five years' time — so the few chart types actually needed are drawn here.

   Text uses currentColor so it inverts correctly under the print stylesheet.
   ═══════════════════════════════════════════════════════════════════════════ */
/* Gridlines and connectors inherit currentColor at low opacity rather than a
   fixed hex, so they stay subtle in the dark UI and print as light grey on
   paper instead of heavy black rules. */
const GRID_OPACITY = 0.17;

function svgEl(w, h, body, extra) {
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h
    + '" preserveAspectRatio="xMidYMid meet" role="img" ' + (extra || '') + '>' + body + '</svg>';
}
function txt(x, y, s, opts) {
  opts = opts || {};
  return '<text x="' + x + '" y="' + y + '" fill="currentColor"'
    + ' font-size="' + (opts.size || 11) + '"'
    + ' font-weight="' + (opts.weight || 400) + '"'
    + ' text-anchor="' + (opts.anchor || 'middle') + '"'
    + ' opacity="' + (opts.opacity == null ? 0.62 : opts.opacity) + '"'
    + (opts.transform ? ' transform="' + opts.transform + '"' : '')
    + '>' + esc(s) + '</text>';
}
function rect(x, y, w, h, fill, r) {
  return '<rect x="' + x + '" y="' + y + '" width="' + Math.max(0, w) + '" height="' + Math.max(0, h)
    + '" fill="' + fill + '" rx="' + (r == null ? 3 : r) + '"/>';
}
function gridline(x1, y1, x2, y2, dash) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2
    + '" stroke="currentColor" stroke-opacity="' + GRID_OPACITY + '" stroke-width="1"'
    + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
}

/* Chooses a rounded axis maximum so gridlines land on readable numbers. */
function niceMax(v) {
  if (v <= 0) return 10;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / mag;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return step * mag;
}

const Svg = {

  /* Vertical bars with an optional dashed reference line — used for the
     scenario comparison, where the reference is today's headcount. */
  bars(items, opts) {
    opts = opts || {};
    if (!items.length) return emptyChart();
    const W = 780, H = opts.height || 260;
    const padL = 52, padR = 16, padT = 26, padB = 46;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    const vals = items.map(i => i.value);
    const refs = opts.reference != null ? [opts.reference] : [];
    const lo = Math.min(0, ...vals, ...refs);
    const hi = Math.max(0, ...vals, ...refs);
    const top = niceMax(hi), bottom = lo < 0 ? -niceMax(-lo) : 0;
    const span = (top - bottom) || 1;
    const y = v => padT + plotH - ((v - bottom) / span) * plotH;

    let s = '';
    const ticks = 4;
    for (let i = 0; i <= ticks; i++) {
      const v = bottom + (span * i / ticks);
      s += gridline(padL, y(v), W - padR, y(v));
      s += txt(padL - 8, y(v) + 4, opts.fmtTick ? opts.fmtTick(v) : Math.round(v), { anchor: 'end', size: 10, opacity: 0.45 });
    }

    const slot = plotW / items.length;
    const bw = Math.min(opts.barWidth || 62, slot * 0.62);
    items.forEach((it, i) => {
      const cx = padL + slot * i + slot / 2;
      const y0 = y(0), y1 = y(it.value);
      s += rect(cx - bw / 2, Math.min(y0, y1), bw, Math.abs(y1 - y0), it.color || '#6366f1');
      s += txt(cx, Math.min(y0, y1) - 7, it.label != null ? it.label : Math.round(it.value), { size: 11.5, weight: 700, opacity: 0.95 });
      s += txt(cx, H - 26, it.name, { size: 11.5, weight: 600, opacity: 0.8 });
      if (it.sub) s += txt(cx, H - 11, it.sub, { size: 10, opacity: 0.5 });
    });

    if (opts.reference != null) {
      const ry = y(opts.reference);
      s += '<line x1="' + padL + '" y1="' + ry + '" x2="' + (W - padR) + '" y2="' + ry
        + '" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>';
      s += txt(W - padR, ry - 6, opts.referenceLabel || 'today', { anchor: 'end', size: 10, opacity: 0.65 });
    }
    return svgEl(W, H, s);
  },

  /* Quarterly build-up: area + line, with a dashed baseline reference. */
  line(points, opts) {
    opts = opts || {};
    if (!points.length) return emptyChart();
    const W = 780, H = opts.height || 240;
    const padL = 56, padR = 20, padT = 24, padB = 38;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    const vals = points.map(p => p.value);
    const refs = opts.reference != null ? [opts.reference] : [];
    const rawLo = Math.min(...vals, ...refs), rawHi = Math.max(...vals, ...refs);
    /* Headcount series barely move relative to their absolute size, so a
       zero-based axis would flatten them into a straight line. Pad instead. */
    const pad = Math.max((rawHi - rawLo) * 0.35, Math.max(rawHi, 1) * 0.02);
    const lo = rawLo - pad, hi = rawHi + pad;
    const span = (hi - lo) || 1;
    const x = i => padL + (points.length === 1 ? plotW / 2 : (plotW * i) / (points.length - 1));
    const y = v => padT + plotH - ((v - lo) / span) * plotH;

    let s = '';
    for (let i = 0; i <= 4; i++) {
      const v = lo + (span * i / 4);
      s += gridline(padL, y(v), W - padR, y(v));
      s += txt(padL - 8, y(v) + 4, opts.fmtTick ? opts.fmtTick(v) : Math.round(v), { anchor: 'end', size: 10, opacity: 0.45 });
    }

    const path = points.map((p, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(p.value)).join(' ');
    const color = opts.color || '#6366f1';
    s += '<path d="' + path + ' L' + x(points.length - 1) + ' ' + (padT + plotH)
       + ' L' + x(0) + ' ' + (padT + plotH) + ' Z" fill="' + color + '" opacity="0.10"/>';
    s += '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round"/>';

    if (opts.reference != null) {
      s += '<line x1="' + padL + '" y1="' + y(opts.reference) + '" x2="' + (W - padR) + '" y2="' + y(opts.reference)
        + '" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>';
      s += txt(W - padR, y(opts.reference) - 6, opts.referenceLabel || '', { anchor: 'end', size: 10, opacity: 0.65 });
    }

    points.forEach((p, i) => {
      s += '<circle cx="' + x(i) + '" cy="' + y(p.value) + '" r="4" fill="' + color
         + '" stroke="var(--surface)" stroke-width="2"/>';
      s += txt(x(i), y(p.value) - 12, p.label != null ? p.label : Math.round(p.value), { size: 11, weight: 700, opacity: 0.9 });
      s += txt(x(i), H - 12, p.name, { size: 11, opacity: 0.6 });
    });
    return svgEl(W, H, s);
  },

  /* Waterfall from today's headcount to the 2027 requirement. Steps carry a
     running total; the first and last are absolute totals, not deltas. */
  waterfall(steps, opts) {
    opts = opts || {};
    if (!steps.length) return emptyChart();
    const W = 780, H = opts.height || 280;
    const padL = 56, padR = 16, padT = 28, padB = 56;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    let running = 0;
    const bars = steps.map(st => {
      const start = st.total ? 0 : running;
      const end = st.total ? st.value : running + st.value;
      running = end;
      return { name: st.name, start, end, value: st.value, total: !!st.total, color: st.color };
    });

    const hi = niceMax(Math.max(...bars.map(b => Math.max(b.start, b.end))));
    const y = v => padT + plotH - (v / (hi || 1)) * plotH;

    let s = '';
    for (let i = 0; i <= 4; i++) {
      const v = hi * i / 4;
      s += gridline(padL, y(v), W - padR, y(v));
      s += txt(padL - 8, y(v) + 4, Math.round(v), { anchor: 'end', size: 10, opacity: 0.45 });
    }

    const slot = plotW / bars.length;
    const bw = Math.min(58, slot * 0.6);
    bars.forEach((b, i) => {
      const cx = padL + slot * i + slot / 2;
      const yTop = Math.min(y(b.start), y(b.end));
      const hgt = Math.max(Math.abs(y(b.end) - y(b.start)), 1.5);
      const color = b.color || (b.total ? '#64748b' : b.value >= 0 ? '#22c55e' : '#f59e0b');
      s += rect(cx - bw / 2, yTop, bw, hgt, color);

      const label = b.total ? Fmt.fte(b.end) : Fmt.fte(b.value, true);
      s += txt(cx, yTop - 7, label, { size: 11.5, weight: 700, opacity: 0.95 });

      /* Connector to the next bar, so the eye follows the running total. */
      if (i < bars.length - 1 && !bars[i + 1].total) {
        s += '<line x1="' + (cx + bw / 2) + '" y1="' + y(b.end) + '" x2="' + (cx + slot - bw / 2)
          + '" y2="' + y(b.end) + '" stroke="currentColor" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3"/>';
      }
      wrapLabel(b.name, Math.max(9, Math.floor(slot / 6.4))).forEach((ln, k) => {
        s += txt(cx, H - 34 + k * 12, ln, { size: 10.5, weight: b.total ? 700 : 500, opacity: b.total ? 0.85 : 0.6 });
      });
    });
    return svgEl(W, H, s);
  },

  /* Horizontal bars — business lines and roles, where names need room. */
  hbars(items, opts) {
    opts = opts || {};
    if (!items.length) return emptyChart();
    const rowH = 30, padT = 10, padB = 26, padL = opts.labelWidth || 150, padR = 62;
    const W = 780, H = padT + padB + items.length * rowH;
    const plotW = W - padL - padR;

    const maxAbs = Math.max(...items.map(i => Math.abs(i.value)), 1);
    const hasNeg = items.some(i => i.value < 0);
    const zeroX = hasNeg ? padL + plotW / 2 : padL;
    const scale = hasNeg ? (plotW / 2) / maxAbs : plotW / maxAbs;

    let s = '';
    items.forEach((it, i) => {
      const cy = padT + i * rowH + rowH / 2;
      const w = Math.abs(it.value) * scale;
      const x = it.value >= 0 ? zeroX : zeroX - w;
      s += rect(x, cy - 9, w, 18, it.color || '#6366f1');
      s += txt(8, cy + 4, fitText(it.name, padL - 20, 11.5), { anchor: 'start', size: 11.5, weight: 600, opacity: 0.82 });
      const lx = it.value >= 0 ? x + w + 7 : x - 7;
      s += txt(lx, cy + 4, it.label != null ? it.label : Fmt.fte(it.value, true),
               { anchor: it.value >= 0 ? 'start' : 'end', size: 11, weight: 700, opacity: 0.9 });
    });
    if (hasNeg) s += gridline(zeroX, padT, zeroX, H - padB);
    return svgEl(W, H, s);
  },

  /* Two-series horizontal bars, mirrored around zero: unlocks to the right,
     releases to the left. Built for the Deliverable Impact page. */
  tornado(items, opts) {
    opts = opts || {};
    if (!items.length) return emptyChart();
    const rowH = 32, padT = 22, padB = 26, padL = opts.labelWidth || 230, padR = 56;
    const W = 780, H = padT + padB + items.length * rowH;
    const plotW = W - padL - padR;
    const maxAbs = Math.max(...items.map(i => Math.max(i.pos, i.neg)), 1);
    const zeroX = padL + plotW / 2;
    const scale = (plotW / 2) / maxAbs;

    let s = txt(zeroX + plotW / 4, padT - 8, 'unlocks →', { size: 10, opacity: 0.5 })
          + txt(zeroX - plotW / 4, padT - 8, '← releases', { size: 10, opacity: 0.5 });

    items.forEach((it, i) => {
      const cy = padT + i * rowH + rowH / 2;
      const wPos = it.pos * scale, wNeg = it.neg * scale;
      if (it.pos) s += rect(zeroX, cy - 9, wPos, 18, '#22c55e');
      if (it.neg) s += rect(zeroX - wNeg, cy - 9, wNeg, 18, '#f59e0b');
      /* Anchored left, not right: if the width estimate is ever short, the label
         loses its tail rather than the first characters that identify it. */
      s += txt(8, cy + 4, fitText(it.name, padL - 20, 11), { anchor: 'start', size: 11, weight: 600, opacity: 0.82 });

      /* Value sits inside the bar when there is room, so a long bar can never
         push its own label back into the name gutter. */
      if (it.pos) {
        const inside = wPos > 34;
        s += txt(zeroX + wPos + (inside ? -6 : 6), cy + 4, Fmt.fte(it.pos),
          { anchor: inside ? 'end' : 'start', size: 10.5, weight: 700, opacity: inside ? 1 : 0.85 });
      }
      if (it.neg) {
        const inside = wNeg > 34;
        s += txt(zeroX - wNeg + (inside ? 6 : -6), cy + 4, Fmt.fte(it.neg),
          { anchor: inside ? 'start' : 'end', size: 10.5, weight: 700, opacity: inside ? 1 : 0.85 });
      }
      if (it.sub) s += txt(W - 8, cy + 4, it.sub, { anchor: 'end', size: 10, opacity: 0.5 });
    });
    s += gridline(zeroX, padT - 4, zeroX, H - padB);
    return svgEl(W, H, s);
  },

  legend(items) {
    return '<div class="legend">' + items.map(i =>
      '<span class="legend-item"><span class="legend-swatch" style="background:' + i.color + '"></span>'
      + esc(i.name) + '</span>').join('') + '</div>';
  },
};

function emptyChart() {
  return '<div class="empty-state">Nothing to chart yet.</div>';
}

/* SVG has no text overflow, so a label longer than its gutter simply runs off
   the left edge of the viewBox and loses its first characters. Truncate by
   estimated width instead, and let the caller stay out of it. */
function fitText(s, maxPx, fontPx) {
  const str = String(s == null ? '' : s);
  const perChar = (fontPx || 11) * 0.63;      // wide enough for caps, digits and em-dashes
  const max = Math.max(4, Math.floor(maxPx / perChar));
  return str.length <= max ? str : str.slice(0, max - 1).trimEnd() + '…';
}

/* Greedy word wrap for axis labels, which have no text-wrapping in SVG. */
function wrapLabel(s, maxChars) {
  const words = String(s).split(/\s+/);
  const lines = [];
  let cur = '';
  words.forEach(w => {
    if (!cur) { cur = w; }
    else if ((cur + ' ' + w).length <= maxChars) { cur += ' ' + w; }
    else { lines.push(cur); cur = w; }
  });
  if (cur) lines.push(cur);
  return lines.slice(0, 2);
}

/* A slim inline meter for utilisation cells. */
function meter(pct, color) {
  const p = Math.max(0, Math.min(100, pct || 0));
  return '<div class="meter"><div class="meter-fill" style="width:' + p + '%;background:'
    + (color || (p < 80 ? 'var(--warn)' : p > 97 ? 'var(--danger)' : 'var(--success)')) + '"></div></div>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   UI CORE — router, chrome, and shared widgets
   ═══════════════════════════════════════════════════════════════════════════ */
const pages = {};
function registerPage(id, mod) { pages[id] = mod; }

const PAGE_TITLES = {
  dashboard: 'Dashboard', scenarios: 'Scenarios', impact: 'Deliverable Impact',
  requests: 'Demand Requests', baseline: 'Current Capacity',
  deliverables: 'Strategy Deliveries', lines: 'Business Lines',
  roles: 'Role Catalogue', settings: 'Data & Settings',
};

function navigate(raw) {
  const id = (raw || 'dashboard').replace(/^#/, '');
  loadPage(pages[id] ? id : 'dashboard');
}

function loadPage(id) {
  document.querySelectorAll('.nav-item').forEach(a =>
    a.classList.toggle('active', a.dataset.page === id));
  document.getElementById('page-title').textContent = PAGE_TITLES[id] || id;

  const content = document.getElementById('content');
  const mod = pages[id];
  try {
    content.innerHTML = mod.render ? mod.render() : '';
    if (mod.init) mod.init();
  } catch (e) {
    console.error(e);
    content.innerHTML = '<div class="alert alert-error"><strong>This page failed to render.</strong><br>'
      + esc(e.message) + '<br><span class="small">The underlying data is untouched — the browser console has the detail.</span></div>';
  }
  updateNavCounts();
  closeSidebar();
  window.scrollTo(0, 0);
}

function refresh() { navigate(window.location.hash.slice(1)); }

function updateNavCounts() {
  const set = (id, n) => { const el = document.getElementById(id); if (el) el.textContent = n || ''; };
  set('count-requests', Store.all('requests').length);
  set('count-baseline', Store.all('baseline').length);
  set('count-deliverables', Store.all('deliverables').length);
  set('count-lines', Store.all('businessLines').length);
  set('count-roles', Store.all('roles').length);
  const y = document.getElementById('brand-year');
  if (y) y.textContent = Store.state.meta.planningYear + ' cycle';
}

/* ── Chrome ───────────────────────────────────────────────────────────────── */
function openSidebar()  { document.getElementById('sidebar').classList.add('open');    document.getElementById('overlay').classList.remove('hidden'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.add('hidden'); }

let _saveTimer = null;
function setSaveState(text, ok) {
  const el = document.getElementById('save-state');
  if (!el) return;
  el.textContent = text;
  el.classList.toggle('saved', !!ok);
}
function flashSaved() {
  setSaveState('Saved', true);
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => setSaveState(''), 1600);
}

function showModal(msg, onConfirm, confirmLabel) {
  const modal = document.getElementById('modal');
  document.getElementById('modal-msg').innerHTML = msg;
  modal.classList.remove('hidden');

  const ok = document.getElementById('modal-confirm');
  const no = document.getElementById('modal-cancel');
  ok.textContent = confirmLabel || 'Delete';

  const cleanup = () => {
    modal.classList.add('hidden');
    ok.replaceWith(ok.cloneNode(true));
    no.replaceWith(no.cloneNode(true));
  };
  document.getElementById('modal-confirm').addEventListener('click', () => { cleanup(); onConfirm(); });
  document.getElementById('modal-cancel').addEventListener('click', cleanup);
}

/* ── File download ────────────────────────────────────────────────────────
   Blob + object URL, which works from a file:// page. Revoked on the next
   tick so the browser has taken the data but nothing leaks. */
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function toCSV(rows) {
  return rows.map(r => r.map(cell => {
    const s = cell == null ? '' : String(cell);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\r\n');
}

function exportCSV(name, rows) {
  downloadFile(name + '-' + Store.state.meta.planningYear + '.csv',
    '﻿' + toCSV(rows), 'text/csv;charset=utf-8');
}

/* ── Form widgets ─────────────────────────────────────────────────────────── */
function optionList(values, selected) {
  return values.map(v => '<option value="' + esc(v) + '"' + (v === selected ? ' selected' : '') + '>' + esc(v) + '</option>').join('');
}
function optionRecords(records, selected, labelFn, placeholder) {
  return (placeholder ? '<option value="">' + esc(placeholder) + '</option>' : '')
    + records.map(r => '<option value="' + esc(r.id) + '"' + (r.id === selected ? ' selected' : '') + '>'
      + esc(labelFn(r)) + '</option>').join('');
}

function fieldHtml(f, value) {
  const id = 'f_' + f.name;
  const hint = typeof f.hint === 'function' ? f.hint() : f.hint;
  let input;
  if (f.type === 'select') {
    input = '<select id="' + id + '">' + f.options(value) + '</select>';
  } else if (f.type === 'textarea') {
    input = '<textarea id="' + id + '" rows="' + (f.rows || 2) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(value == null ? '' : value) + '</textarea>';
  } else if (f.type === 'number') {
    input = '<input id="' + id + '" type="number" step="' + (f.step || 'any') + '"'
      + (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '')
      + ' value="' + (value == null ? '' : esc(value)) + '">';
  } else {
    input = '<input id="' + id + '" type="text" placeholder="' + esc(f.placeholder || '') + '" value="' + esc(value == null ? '' : value) + '">';
  }
  return '<div class="field' + (f.full ? ' full' : '') + '">'
    + '<label for="' + id + '">' + esc(f.label)
    + (hint ? ' <span class="hint">' + esc(hint) + '</span>' : '') + '</label>'
    + input + '</div>';
}

function readField(f) {
  const el = document.getElementById('f_' + f.name);
  if (!el) return null;
  if (f.type === 'number') {
    const raw = el.value.trim();
    return raw === '' ? null : Number(raw);
  }
  return el.value;
}

/* ═══════════════════════════════════════════════════════════════════════════
   CRUD PAGE FACTORY

   Business lines, roles, deliverables, capacity rows and requests are all the
   same page: a table, an add/edit form, and a delete confirm. Written once.

   Hooks let a page add anything the generic shape cannot express — the
   requests page uses them for the strategy-delivery linking UI.
   ═══════════════════════════════════════════════════════════════════════════ */
function makeCrudPage(cfg) {
  let editingId = null;
  let formOpen = false;
  let extraState = null;

  const blank = () => (typeof cfg.defaults === 'function' ? cfg.defaults() : Object.assign({}, cfg.defaults));
  const current = () => (editingId ? Store.byId(cfg.key, editingId) : null) || blank();

  const page = {
    render() {
      return '<div class="page-header">' + esc(cfg.title) + '</div>'
        + '<div class="page-sub">' + cfg.subtitle + '</div>'
        + '<div id="crud-form-slot"></div>'
        + '<div class="section">'
        +   '<div class="section-header">'
        +     '<span class="section-title">' + esc(cfg.tableTitle || cfg.title) + '</span>'
        +     '<span class="section-note" id="crud-count"></span>'
        +     '<div class="spacer"></div>'
        +     (cfg.filters ? '<div id="crud-filters" class="flex gap-2 flex-wrap no-print"></div>' : '')
        +     '<button class="btn btn-ghost btn-sm no-print" id="crud-export">Export CSV</button>'
        +     '<button class="btn btn-primary btn-sm no-print" id="crud-add">+ Add</button>'
        +   '</div>'
        +   '<div class="table-wrap" id="crud-table"></div>'
        +   (cfg.footnote ? '<div class="footnote">'
              + (typeof cfg.footnote === 'function' ? cfg.footnote() : cfg.footnote) + '</div>' : '')
        + '</div>';
    },

    init() {
      if (cfg.filters) renderFilters();
      renderTable();
      document.getElementById('crud-add').addEventListener('click', () => {
        editingId = null; formOpen = true; extraState = null; renderForm();
      });
      document.getElementById('crud-export').addEventListener('click', () => {
        exportCSV(cfg.key, cfg.csv(rows()));
      });
    },
  };

  function filterValues() {
    const out = {};
    (cfg.filters || []).forEach(f => {
      const el = document.getElementById('flt_' + f.name);
      out[f.name] = el ? el.value : '';
    });
    return out;
  }

  function rows() {
    let list = Store.all(cfg.key).slice();
    if (cfg.filters) {
      const v = filterValues();
      list = list.filter(item => (cfg.filters || []).every(f => !v[f.name] || f.test(item, v[f.name])));
    }
    return cfg.sort ? list.sort(cfg.sort) : list;
  }

  function renderFilters() {
    document.getElementById('crud-filters').innerHTML = (cfg.filters || []).map(f =>
      '<select id="flt_' + f.name + '" style="width:auto;font-size:12.5px;padding:6px 9px">'
      + '<option value="">' + esc(f.label) + '</option>' + f.options() + '</select>').join('');
    (cfg.filters || []).forEach(f => {
      document.getElementById('flt_' + f.name).addEventListener('change', renderTable);
    });
  }

  function renderTable() {
    const list = rows();
    const countEl = document.getElementById('crud-count');
    const total = Store.all(cfg.key).length;
    if (countEl) countEl.textContent = list.length === total
      ? total + ' record' + (total === 1 ? '' : 's')
      : list.length + ' of ' + total;

    const wrap = document.getElementById('crud-table');
    if (!list.length) {
      wrap.innerHTML = '<div class="empty-state">' + (total ? 'Nothing matches these filters.' : esc(cfg.emptyText || 'Nothing here yet.')) + '</div>';
      return;
    }

    const head = '<tr>' + cfg.columns.map(c => '<th' + (c.right ? ' class="right"' : '') + '>' + esc(c.head) + '</th>').join('')
      + '<th class="right no-print"></th></tr>';
    const body = list.map(item => '<tr data-id="' + esc(item.id) + '">'
      + cfg.columns.map(c => '<td' + (c.right ? ' class="right"' : '') + (c.cls ? ' class="' + c.cls(item) + '"' : '') + '>' + c.cell(item) + '</td>').join('')
      + '<td class="right no-print"><div class="cell-actions">'
      + '<button class="btn btn-icon" data-act="edit">Edit</button>'
      + '<button class="btn btn-icon" data-act="del">Delete</button>'
      + '</div></td></tr>').join('');

    const foot = cfg.footRow ? '<tfoot>' + cfg.footRow(list) + '</tfoot>' : '';
    wrap.innerHTML = '<table><thead>' + head + '</thead><tbody>' + body + '</tbody>' + foot + '</table>';

    wrap.querySelectorAll('button[data-act]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const id = btn.closest('tr').dataset.id;
        if (btn.dataset.act === 'edit') {
          editingId = id; formOpen = true; extraState = null; renderForm();
        } else {
          const item = Store.byId(cfg.key, id);
          showModal(cfg.deletePrompt ? cfg.deletePrompt(item) : 'Delete this record?', () => {
            Store.remove(cfg.key, id);
            if (editingId === id) { editingId = null; formOpen = false; }
            renderForm(); renderTable(); updateNavCounts();
          });
        }
      });
    });
  }

  function renderForm() {
    const slot = document.getElementById('crud-form-slot');
    if (!formOpen) { slot.innerHTML = ''; return; }

    const item = current();
    if (extraState == null && cfg.extraInit) extraState = cfg.extraInit(item);

    slot.innerHTML = '<div class="section no-print"><div class="card">'
      + '<div class="section-header"><span class="section-title">'
      + (editingId ? 'Edit' : 'New') + ' ' + esc(cfg.singular) + '</span></div>'
      + '<div id="form-errors"></div>'
      + '<div class="form-grid">' + cfg.fields.map(f => fieldHtml(f, item[f.name])).join('') + '</div>'
      + (cfg.extraForm ? cfg.extraForm(item, extraState) : '')
      + '<div class="modal-actions" style="justify-content:flex-start;margin-top:16px">'
      +   '<button class="btn btn-primary" id="form-save">' + (editingId ? 'Save changes' : 'Add ' + esc(cfg.singular)) + '</button>'
      +   '<button class="btn btn-ghost" id="form-cancel">Cancel</button>'
      + '</div></div></div>';

    if (cfg.extraBind) cfg.extraBind(extraState, () => renderForm(), item);

    document.getElementById('form-cancel').addEventListener('click', () => {
      formOpen = false; editingId = null; extraState = null; renderForm();
    });
    document.getElementById('form-save').addEventListener('click', save);
  }

  function save() {
    const values = {};
    cfg.fields.forEach(f => { values[f.name] = readField(f); });
    if (cfg.extraCollect) cfg.extraCollect(values, extraState);
    if (cfg.transform) cfg.transform(values);

    const errors = cfg.validate ? cfg.validate(values) : [];
    const box = document.getElementById('form-errors');
    if (errors.length) {
      box.innerHTML = '<div class="alert alert-error"><strong>Fix these first:</strong><ul>'
        + errors.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul></div>';
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
    box.innerHTML = '';

    if (editingId) Store.update(cfg.key, editingId, values);
    else Store.add(cfg.key, Object.assign(blank(), values));

    formOpen = false; editingId = null; extraState = null;
    renderForm(); renderTable(); updateNavCounts();
  }

  return page;
}

   The register. An ask and a redundancy are the same record with opposite
   signs, which is why one page and one form covers both.

function renderLinkChips(st) {
  if (!st.links.length) {
    return '<div class="small text-muted">No strategy delivery attached — this ask is unconditional.</div>';
  }
  return st.links.map((l, i) => {
    const d = Store.byId('deliverables', l.deliverableId);
    const p = Planning.effectiveProbability(d);
    return '<span class="linkchip ' + (st.changeType === 'Decrease' ? 'release' : 'unlock') + '">'
      + esc(d ? d.name : '(deleted delivery)') + ' · ' + Fmt.pct(p * 100)
      + '<button type="button" data-rm="' + i + '" title="Remove">&#10005;</button></span>';
  }).join('');
}

/* Shows, at data-entry time, exactly what each scenario will do with this ask.
   The contingency model is the whole point of the tool and is easy to get
   wrong in the abstract, so it is made concrete here rather than discovered
   later on the Scenarios page. */
function renderRequestPreview(st) {
  const probe = {
    changeType: st.changeType, commitment: st.commitment,
    fte: st.fte || 0, links: st.links,
  };
  const p = Planning.combinedProbability(probe);
  const sign = st.changeType === 'Decrease' ? -1 : 1;

  const cells = SCENARIOS.map(s => {
    const f = Planning.inclusionFactor(probe, s);
    const eff = sign * (Math.abs(st.fte) || 0) * f;
    const dim = f === 0 ? ' style="opacity:.4"' : '';
    return '<td class="right nums"' + dim + '>' + (f === 0 ? '—' : Fmt.fte(eff, true)) + '</td>';
  }).join('');

  let note;
  if (st.commitment === 'Committed' && st.links.length) {
    note = 'Marked <strong>Committed</strong>, so the attached trigger'
      + (st.links.length > 1 ? 's are' : ' is') + ' ignored — it counts in full everywhere.';
  } else if (!st.links.length && st.commitment === 'Contingent') {
    note = 'Marked <strong>Contingent</strong> but nothing gates it, so it behaves as certain in every scenario except Committed.';
  } else if (st.links.length > 1) {
    note = 'Combined likelihood is the product of ' + st.links.length + ' triggers ('
      + st.links.map(l => Fmt.pct(Planning.effectiveProbability(Store.byId('deliverables', l.deliverableId)) * 100)).join(' × ')
      + ' = <strong>' + Fmt.pct(p * 100) + '</strong>), assuming they are independent.';
  } else {
    note = 'Combined likelihood <strong>' + Fmt.pct(p * 100) + '</strong>.';
  }

  return '<div class="card" style="background:var(--surface2)">'
    + '<div class="small fw-600 mb-3">How each scenario will count this ask</div>'
    + '<div class="table-wrap" style="background:transparent;border:none"><table>'
    + '<thead><tr>' + SCENARIOS.map(s => '<th class="right">' + s + '</th>').join('') + '</tr></thead>'
    + '<tbody><tr>' + cells + '</tr></tbody></table></div>'
    + '<div class="small text-dim" style="margin-top:9px">' + note + '</div></div>';
}
