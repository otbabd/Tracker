<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Org Explorer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏢</text></svg>">
  <link rel="stylesheet" href="/org/css/org.css">
</head>
<body>

<header id="topbar">
  <div class="brand">🏢 <span>Org Explorer</span></div>

  <div class="topbar-mid">
    <label class="field compact">
      <span>Dataset</span>
      <select id="dataset-select"></select>
    </label>
    <button class="btn btn-primary" id="btn-upload">⬆ Upload file</button>
  </div>

  <div class="topbar-end">
    <button class="btn btn-ghost" id="btn-export">Export CSV</button>
    <a class="btn btn-ghost" href="/" title="Back to Trading Tracker">📈</a>
  </div>
</header>

<nav id="tabs">
  <button class="tab active" data-view="chart">Org Chart</button>
  <button class="tab" data-view="positions">Positional Hierarchy</button>
  <button class="tab" data-view="headcount">Headcount</button>
  <button class="tab" data-view="people">People</button>
  <button class="tab" data-view="quality">Data Quality <span class="tab-badge hidden" id="issue-badge">0</span></button>
</nav>

<section id="filters">
  <label class="field grow">
    <span>Search</span>
    <input type="search" id="f-search" placeholder="Name, title, ID, email…" autocomplete="off">
  </label>
  <label class="field"><span>Function</span><select id="f-function"></select></label>
  <label class="field"><span>Department</span><select id="f-department"></select></label>
  <label class="field"><span>Job Level</span><select id="f-job_level"></select></label>
  <label class="field"><span>Location</span><select id="f-location"></select></label>
  <label class="field"><span>Status</span>
    <select id="f-vacancy">
      <option value="All">All</option>
      <option value="Filled">Filled</option>
      <option value="Vacant">Vacant</option>
    </select>
  </label>
  <button class="btn btn-ghost" id="btn-reset">Reset</button>
  <div class="filter-summary" id="filter-summary"></div>
</section>

<main id="content"><div class="loading">Loading…</div></main>

<!-- Detail drawer -->
<aside id="drawer" class="drawer hidden">
  <div class="drawer-head">
    <h3 id="drawer-title">Details</h3>
    <button class="icon-btn" id="drawer-close" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div id="drawer-overlay" class="overlay hidden"></div>

<!-- Import modal -->
<div id="import-modal" class="modal hidden">
  <div class="modal-box wide">
    <div class="modal-head">
      <h3>Import org file</h3>
      <button class="icon-btn" id="import-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="import-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- Chart.js is vendored rather than CDN-loaded: org data is often handled offline. -->
<script src="/org/vendor/chart.umd.min.js"></script>
<script src="/org/js/org-app.js"></script>
<script src="/org/js/org-import.js"></script>
<script src="/org/js/org-chart.js"></script>
<script src="/org/js/org-positions.js"></script>
<script src="/org/js/org-headcount.js"></script>
<script src="/org/js/org-people.js"></script>
<script src="/org/js/org-quality.js"></script>
<script>OrgApp.boot();</script>
</body>
</html>
