services:
  - type: web
    name: trading-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/trades.db
      - key: ORG_DB_PATH
        value: /data/org.db
